name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            zmala_server/package-lock.json
      - name: Install Linux test and lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk python3-pil python3-pil.imagetk python3-gi python3-gi-cairo python3-cairo python3-websocket gir1.2-pango-1.0 cppcheck g++
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -r requirements-dev.txt -r build_tools/doorstop-requirements.txt
          npm ci --ignore-scripts
          npm --prefix zmala_server ci --ignore-scripts
      - run: make lint
      - run: make test
      - name: Packaging and firmware simulation
        run: |
          .venv/bin/python -m unittest discover -s build_tools/tests -p 'test_*.py'
          mkdir -p build_tools/tmp/keypad
          g++ -std=c++11 -Wall -Wextra -Werror -I keypad/tests keypad/tests/firmware_test.cpp -o build_tools/tmp/keypad/firmware-test
          build_tools/tmp/keypad/firmware-test
      - name: Requirements
        run: .venv/bin/doorstop --no-reformat --error-all --no-review-check --project "$GITHUB_WORKSPACE"
      - name: Native video worker and preview regressions
        run: |
          sudo apt-get install -y libmediastreamer-dev
          sh build_tools/linux/test-video-workers.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm ci --ignore-scripts
          npm --prefix zmala_server ci --ignore-scripts
          python -m pip install -r requirements-dev.txt pillow websocket-client
      - run: npm test
      - run: npm run typecheck
      - run: python -m unittest discover -s zmala_terminal/tests -p 'test_*.py'
      - run: python -m unittest discover -s build_tools/tests -p 'test_*.py'
      - run: powershell -NoProfile -File build_tools/lint-powershell.ps1
