name: Verify
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Require a new release version
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 build_tools/release/github_release.py check-pr-version
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            zmala_server/package-lock.json
      - name: Install Linux test and lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk python3-pil python3-pil.imagetk python3-gi python3-gi-cairo python3-cairo python3-websocket gir1.2-pango-1.0 xvfb xauth cppcheck g++ nftables iproute2
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -r requirements-dev.txt -r build_tools/doorstop-requirements.txt
          npm ci --ignore-scripts
          npm --prefix zmala_server ci --ignore-scripts
          npx playwright install --with-deps chromium
      - run: make lint
      - name: LLT coverage (HLT and ad-hoc excluded)
        run: xvfb-run -a make coverage-llt
      - name: System tests with a real Tk display
        run: xvfb-run -a make test-hlt test-hlt-display
      - name: Ethernet-only SSH (isolated network namespaces)
        run: sudo .venv/bin/python -m unittest tests.server.HLT.test_ssh_guard_linux tests.terminal.HLT.test_ssh_guard_linux -v
      - name: Development-tool regression checks (not product RBT)
        run: xvfb-run -a make test-adhoc
      - name: Requirements
        run: make requirements
      - name: Requirements report
        uses: actions/upload-artifact@v4
        with:
          name: zmala-requirements
          path: requirements/output/
          if-no-files-found: error
      - name: Native video worker and preview regressions
        run: |
          # Match the supported Pi OS SDK; Ubuntu 24.04 ships an older API.
          docker run --rm -v "$PWD:/work" -w /work debian:trixie-slim sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends build-essential python3-pil libavcodec-dev libavutil-dev pkg-config libmediastreamer-dev libegl-dev libgles-dev libglew-dev ca-certificates patch
            ZMALA_NATIVE_COVERAGE_DIR=/work/tests/coverage/LLT/terminal/native sh tests/support/terminal/run-native.sh
            python3 build_tools/linux/build-turn.py
          '
      - name: Restore coverage report ownership after Docker
        if: always()
        run: |
          if [ -d tests/coverage/LLT/terminal/native ]; then
            sudo chown -R "$(id -u):$(id -g)" tests/coverage/LLT/terminal/native
          fi
      - name: Consolidate coverage report
        run: .venv/bin/python build_tools/rbt_coverage.py --report-only
      - name: LLT coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zmala-llt-coverage
          path: |
            tests/coverage/LLT/
            !tests/coverage/LLT/server/javascript/raw/
            !tests/coverage/LLT/terminal/native/native-*/
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm ci --ignore-scripts
          npm --prefix zmala_server ci --ignore-scripts
          python -m pip install -r requirements-dev.txt pillow websocket-client
      - run: npm run typecheck
      - run: |
          python -m unittest discover -s tests/terminal/LLT -t . -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/terminal/HLT -t . -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/server/LLT -t . -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/server/HLT -t . -p 'test_*.py'
      - run: python tests/terminal/HLT/render_cache_ui.py
      - run: python -m unittest discover -s tests/adhoc -t . -p 'test_*.py'
      - run: powershell -NoProfile -File build_tools/lint-powershell.ps1

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Build and check Android preview
        run: make phone test-android
      - uses: actions/upload-artifact@v4
        with:
          name: zmalaphone-debug
          path: |
            zmala_phone/app/build/outputs/apk/debug/app-debug.apk
            zmala_phone/app/build/reports/tests/
            zmala_phone/app/build/reports/lint-results-debug.*
