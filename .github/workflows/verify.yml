name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            zmala_server/package-lock.json
      - name: Install Linux test and lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk python3-pil python3-pil.imagetk python3-gi python3-gi-cairo python3-cairo python3-websocket gir1.2-pango-1.0 xvfb xauth cppcheck g++
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -r requirements-dev.txt -r build_tools/doorstop-requirements.txt
          npm ci --ignore-scripts
          npm --prefix zmala_server ci --ignore-scripts
      - run: make lint
      - run: make test
      - name: Real Linux rendering under cache pressure
        run: xvfb-run -a .venv/bin/python tests/terminal/HLT/render_cache_ui.py
      - name: Development-tool regression checks (not product RBT)
        run: make test-adhoc
      - name: Requirements
        run: make requirements
      - name: Requirements report
        uses: actions/upload-artifact@v4
        with:
          name: zmala-requirements
          path: requirements/output/
          if-no-files-found: error
      - name: Native video worker and preview regressions
        run: |
          # Match the supported Pi OS SDK; Ubuntu 24.04 ships an older API.
          docker run --rm -v "$PWD:/work" -w /work debian:trixie-slim sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends build-essential python3-pil libavcodec-dev libavutil-dev pkg-config libmediastreamer-dev libegl-dev libgles-dev libglew-dev
            sh tests/support/terminal/run-native.sh
          '
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm ci --ignore-scripts
          npm --prefix zmala_server ci --ignore-scripts
          python -m pip install -r requirements-dev.txt pillow websocket-client
      - run: npm run typecheck
      - run: |
          python -m unittest discover -s tests/terminal/LLT -t . -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/terminal/HLT -t . -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/server/LLT -t . -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/server/HLT -t . -p 'test_*.py'
      - run: python tests/terminal/HLT/render_cache_ui.py
      - run: python -m unittest discover -s tests/adhoc -t . -p 'test_*.py'
      - run: powershell -NoProfile -File build_tools/lint-powershell.ps1
