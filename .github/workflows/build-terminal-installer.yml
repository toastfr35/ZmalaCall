name: Build terminal installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build_tools/windows_installer/**'
      - 'build_tools/linux/**'
      - 'build_tools/tests/**'
      - 'zmala_terminal/**'
      - 'docs/**'
      - 'output/**'
      - '.github/workflows/build-terminal-installer.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: build_tools/windows_installer/requirements.txt
      - name: Install build dependencies
        run: python -m pip install -r build_tools/windows_installer/requirements.txt
      - name: Test deployment and confirmation
        run: |
          python -m unittest discover -s build_tools/tests -p 'test_*installer*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s build_tools/tests -p 'test_linux_package.py'
      - name: Build standalone installer
        run: python build_tools/windows_installer/build.py
      - name: Check packaged UI and payload
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'installer-smoke.txt'
          $process = Start-Process -FilePath 'build_tools/dist/zmala_terminal_setup.exe' -ArgumentList '--smoke-test', $report -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Installer smoke test timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          if (-not (Test-Path $report)) { throw 'Installer did not produce its smoke-test report' }
          Get-Content $report
          if ((Get-Content $report -Raw) -notmatch 'GUI initialized; bundled package checksum verified') {
            throw 'Installer smoke test failed'
          }
      - name: Check packaged headless mode
        # The previous step exercises the GUI. This one verifies the same
        # packaged EXE without creating any Tk window or contacting a Pi.
        if: success()
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'installer-headless-smoke.txt'
          $log = Join-Path $env:RUNNER_TEMP 'installer-headless.log'
          $process = Start-Process -FilePath 'build_tools/dist/zmala_terminal_setup.exe' -ArgumentList '--headless', '--smoke-test', $report, '--log', $log -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Headless smoke test timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Headless installer exited with $($process.ExitCode)" }
          if (-not (Test-Path $report)) { throw 'Headless smoke-test report missing' }
          Get-Content $log
          if ((Get-Content $report -Raw) -notmatch 'Headless mode; bundled package checksum verified') {
            throw 'Headless smoke test failed'
          }
          $process = Start-Process -FilePath 'build_tools/dist/zmala_terminal_setup.exe' -ArgumentList '--headless', '--log', $log -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Consent check timed out' }
          if ($process.ExitCode -ne 2) { throw 'Missing --yes must return exit code 2' }
      - name: Collect download files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build_tools/dist/download | Out-Null
          Copy-Item build_tools/dist/zmala_terminal_setup.exe build_tools/dist/download/
          Copy-Item output/docx/ZmalaCall-Pi4-Installation-Guide.docx build_tools/dist/download/
          Copy-Item output/pdf/ZmalaCall-Pi4-Installation-Guide.pdf build_tools/dist/download/
      - name: Upload installer and instructions
        uses: actions/upload-artifact@v4
        with:
          name: zmala-terminal-setup
          path: build_tools/dist/download/*
          if-no-files-found: error
          retention-days: 90
