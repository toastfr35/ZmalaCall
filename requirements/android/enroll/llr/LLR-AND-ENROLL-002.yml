text: 'The app shall validate QR type, version, App discriminator, device ID and token; bind received configuration to that identity; bound HTTP response sizes and timeouts; reject redirects, malformed secure-call configurations, malformed contact entries and duplicate contact identities, and secure mode over HTTP enrollment; and store only enrollment in application-private no-backup storage. The app shall rely on Android Clear storage / Clear app data to remove enrollment and terminate its process; reopening shall return to QR setup. Setup shall support a local QR image through Android''s document picker without broad storage permission, copying the image to disk or uploading it. Image input shall be bounded to 20 MiB and 64 million source pixels, with sampled decoding at no more than 1800 pixels per side. Imported text shall use the same QR validation and explicit server confirmation as camera scanning. Cancellation shall preserve setup.Account portrait downloads shall accept PNG/JPEG
  up to 2 MiB and GIF up to 16 MiB from same-origin authenticated photo paths without following redirects.

  '
verification: Test malformed or mismatched QR/configuration and redirects; exercise enrollment persistence, Android app-data clearing and return to QR setup. Inspect manifest and no-backup storage policy. Reject null/non-object contacts, invalid or duplicate IDs, and missing, non-string or blank names before rendering or reconciling notices. Generate QR and non-QR images and verify decoded text, malformed/oversized rejection and stream closure.
