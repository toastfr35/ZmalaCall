text: The app shall accept the tls-relay policy only from HTTPS enrollment with complete unexpired relay
  credentials and valid SIP TLS and TURN TLS endpoints. It shall use Android-trusted certificates and
  verify server names, disable SIP UDP/plain TCP, enable ICE with forced TURN relay over TLS, and require
  SRTP for outgoing and incoming media. It shall not accept trust anchors from QR or server configuration.
  Changed SIP or relay credentials shall remain pending until an idle core restart; a directory refresh
  during a call shall not discard the pending change. Expired applied credentials shall prevent a new
  call. LAN mode shall retain UDP without ICE. TURN TLS parsing shall preserve complete STUN and
  ChannelData frames across fragmented headers, payloads and alignment padding, omitting padding from
  delivered ChannelData.
  TURN TLS writes shall retain a frame through short writes and temporary socket backpressure.
  A write that cannot complete within three seconds shall fail and shut down the connection so a
  partial frame is not followed by another frame on the same stream.
  Temporary configuration HTTP transport failures shall preserve an established call and show a
  reconnecting notice. Revocation or malformed identity/security configuration shall still stop
  registration and media; recovery shall not apply unvalidated data or clear pending credential changes.
