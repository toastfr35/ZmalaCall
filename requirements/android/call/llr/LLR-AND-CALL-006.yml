verification: Unit-test valid and malformed policies, expiry, HTTPS enrollment and transport-key changes.
  Inspect the real native core TLS, certificate, NAT and encryption settings. Refresh credentials without
  restarting and assert renewal remains pending; apply at restart and verify LAN policy separately. Qualify
  handshakes and cross-network media in the physical HLT. Check the OS-derived CA file used by native
  TLS. Compare fragmented native TURN frames byte for byte on both Android ABIs, reproduce the original
  SDK defect as a negative control, and assert the corrected parser handles live relay traffic.
  Inject short writes, WANT_READ/WANT_WRITE, timeout, peer closure and poll failure; assert exact
  output bytes, stable retry buffers and bounded failure. Assert the corrected writer handles live traffic.
