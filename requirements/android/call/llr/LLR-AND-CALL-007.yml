area: In-call photo sharing
scope: Core
text: For a connected call to a Terminal contact with server photo-sharing capability, the app shall offer
  the system image picker without broad library access and upload one selected photo to the authenticated
  current-call endpoint. It shall bound source data to 20 MiB/64 million pixels and normalize orientation
  and size to a metadata-free JPEG of at most 1600 pixels per side and 2 MiB. The same photo shall appear
  with preserved proportions above the local and received video; call audio and controls shall remain
  active. Stop or cancel shall clear local sharing immediately and request server deletion; a periodically
  renewed lease shall limit stale remote display. Sharing shall survive Activity recreation, stop when
  the call changes/ends, reject late picker/upload results and report upload/renewal failure. Choosing
  no image shall leave the call unchanged.
