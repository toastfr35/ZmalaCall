text: The app shall register its Firebase token at the enrolled origin using its App bearer identity,
  renew it while used, and remove the destination when notifications are disabled and the app next opens.
  With notification permission, an FCM callback shall show a native incoming-call alert only for a valid
  enrollment HMAC, device ID and deadline no more than 90 seconds away. The alert shall use locally cached
  caller names, Answer and Decline actions, and automatic timeout; duplicates and ring messages received
  after cancellation shall be suppressed for two minutes. Answer shall reconnect without starting media
  from the push alone and auto-answer only the matching, unexpired independently authorized SIP call.
  Acceptance shall be queued after the native incoming-call state callback returns and shall recheck
  that the activity is visible, the same call is still incoming and the authorization has not expired.
  Decline shall dismiss locally and send an authenticated cancellation request. Cancellation shall dismiss
  the notification. Background alert handling shall not capture microphone/camera or maintain a permanent
  SIP connection. The app shall explain notification permission and force-stop limitations.
verification: Verify signed and malformed payload boundaries in JVM tests, native notification actions/expiry/deduplication
  on Android and bearer POSTs. Exercise notification answer through fresh registration and a matching
  authenticated SIP call in HLT; qualify FCM/locked-screen/Doze separately.
  Verify deferred acceptance and rejection after cancellation, visibility loss or expiry in JVM tests.
