text: When secure relay mode is configured, ZmalaPhone shall call and receive calls from permitted terminals
  on separate NAT networks through the Zmala deployment. It shall use authenticated encrypted signalling
  and relayed encrypted media, without requiring inbound router rules at the phone or terminal or falling
  back to plaintext.
