verification: Use the enrolled physical phone on mobile data and the Pi terminal on a separate network.
  Check HTTPS configuration, SIP TLS, relay media counters, moving video and speech in both directions,
  incoming push wake, cancellation and hangup. Record actual hardware results separately from the plan.
