text: The Android app shall present authenticated, expiring incoming-call notifications through Firebase
  when its activity is not open. Answer shall reconnect and accept only the matching authorized SIP call;
  decline, cancellation and expiry shall dismiss the alert. Notification permission denial and Android
  force-stop restrictions shall be explained.
verification: Exercise background notification delivery, answer, decline, expiry and forged/stale messages;
  qualify actual FCM delivery with the phone asleep.
