text: The Android preview shall register with the configured LAN SIP server, initiate video calls to permitted
  contacts, allow a user to answer or decline authenticated incoming calls and end calls while the app
  is visible. A user-started or answered call shall retain audio through Home, activity recreation and
  screen locking under a foreground call service, pause camera sending while hidden, and restore video
  surfaces/camera on return without starting another call. An ongoing notification shall return to or
  end that call. Idle closed apps shall release SIP/media and rely on push. Physical interoperability shall be qualified
  separately.
verification: Use the native SDK with a disposable SIP endpoint to exercise registration, video INVITE,
  signed incoming admission, rejection and termination. Verify physical Pi media in the documented hardware
  procedure.
