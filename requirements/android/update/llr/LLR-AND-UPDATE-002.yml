header: Verified idle installation policy
text: The app shall check the fixed public ZmalaCall latest-release endpoint on opening no more than every
  six hours and schedule a daily network-constrained check. It shall offer only newer stable releases
  with one exact ZmalaPhone.apk asset, bounded size and SHA256 digest. Downloads shall use trusted HTTPS
  GitHub asset origins without enrollment credentials, remain private, and be verified for length, digest,
  application ID, increasing version code, matching release version, non-debuggable flag and the existing
  signing certificate before submission to Android signature validation. Automatic updates shall default
  off, be offered only on Android 12 or later, and require installation permission, an unmetered network
  and thirty seconds of visible idle time. Update and Later shall be available; Later shall defer prompting
  and automatic work for a day. APK transfer and staging shall stop when the app backgrounds or a call
  rings or starts, and installation commit shall be mutually exclusive with incoming and outgoing calls.
  Committed installation shall temporarily refuse new calls until it finishes. Android approval shall
  be requested only for a user-initiated update; automatic approval fallback shall require a manual Update
  action. Failed or partial downloads shall be removed and retries bounded. Enrollment shall be retained.
  A discreet installed version and Updates action shall appear only on the contact screen, never setup
  or call screens.
verification: Unit-test metadata, origins, archive identity and signature matching, and call/install exclusion.
  Inject HTTP responses to verify fixed-origin metadata, per-hop APK redirect checks and redirect limits,
  ten-second connection/read timeouts, a one-MiB metadata limit and connection/stream cleanup on failures.
  Exercise the actual update UI and an Android PackageInstaller self-update with a same-key higher-version
  fixture; verify rejection paths, retained enrollment and confirmation fallback separately on older Android.
