text: |
  The product shall support cancellable callback requests, callback notifications and
  reminders, and per-contact unread indicators for missed calls and phone text
  notifications.
verification: |
  Request and cancel callbacks; exercise delayed reminders, caller cancellation and
  incoming phone text without automatic dialing.
