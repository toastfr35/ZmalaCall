text: |
  The product shall retain configuration and relevant contact history across ordinary
  restarts, reject stale or invalid changes, and expose failures without reporting
  incomplete work as successful.
verification: |
  Restart with saved state; inject invalid configuration, interrupted work and storage
  errors and verify recovery and explicit failure reporting.
