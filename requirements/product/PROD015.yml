text: The product shall provide a ZmalaPhone Android companion using the terminal visual identity, server
  QR setup and mutually exclusive App or Terminal account types. It shall support authorized video calling,
  Firebase incoming-call wake-up and encrypted server-relayed calls between separate NAT networks when
  secure mode is deployed. It shall support missed-call notices, shared callback requests and optional
  verified application updates that do not interrupt calls.
verification: Exercise app enrollment, authorized contacts and native call signaling on Android. Separately
  qualify camera, microphone and bidirectional media against the Pi terminal on physical hardware.
