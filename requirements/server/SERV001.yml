text: |
  The Node.js server shall run independently of terminal software on Raspberry Pi OS/Linux
  with systemd deployment. It shall provide LAN administration and device HTTP APIs, SIP
  over UDP/TCP and an audio/video packet relay. It shall not require a terminal runtime,
  transcode calls or record media.

  Default listeners shall expose HTTP on port 8080, SIP on port 5060 and the relay port
  pool 20000 through 20199 on all IPv4 interfaces, subject to configuration and host
  networking. HTTP deployment shall be documented for a trusted LAN; optional HTTPS shall
  reject remote plaintext administration when enabled. Device transport and admin
  transport rules shall be distinguished. Administrative authentication is specified in
  SERV019; SSH ingress restrictions shall not restrict application listeners to Ethernet.
