text: |
  Authenticated administration shall report and persistently enable/disable wired SSH
  through a fixed-action privileged helper without stopping HTTP, SIP or media;
  unavailable helper/status shall report failure. Installation shall keep wired SSH
  enabled until deployment/reboot checks finish.
verification: |
  Toggle SSH, reboot, inspect helper permissions and verify application listeners remain
  active.
