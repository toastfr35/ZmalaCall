text: |
  Startup shall finish a pending restore before constructing live stores or opening listeners. Apply failure shall commit a rollback phase and restore previous files. Failed rollback shall stop startup and retain the journal. Successful recovery shall save its outcome and remove the pending journal.
verification: |
  Interrupt apply and rollback, restart repeatedly and inject recovery errors. Check no partial state is served.
