text: |
  Signals, listener errors and explicit shutdown shall share one shutdown operation. It
  shall stop all HTTP/HTTPS listeners and SIP, wait for accepted HTTP requests to finish
  and then flush pending state. Failure to bind one listener shall close other listeners
  already opened by that server instance. Concurrent close requests shall not close SIP
  twice or flush before in-flight mutations complete.

  SIP/media shutdown shall release dialogs and relay ownership and prevent late
  asynchronous allocation from resurrecting closed media resources. The current drain
  mechanism shall not be described as a bounded deadline for stalled requests or native
  work; such limits require separate implementation and qualification.
