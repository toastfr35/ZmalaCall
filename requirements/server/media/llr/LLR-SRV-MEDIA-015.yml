text: When a secure deployment policy is present, the server shall accept SIP over TLS only and require
  HTTPS for configuration. It shall advertise the public TLS SIP endpoint, preserve ICE SDP, reject
  active media sections without ICE credentials or supported SRTP keys, and allocate no legacy UDP
  relay sockets. It shall issue per-account TURN credentials with an eight-hour expiry from the current
  hour. It shall refresh these credentials in configuration responses and shall not expose the shared
  signing secret. Invalid deployment settings shall prevent startup.
verification: Use fixed-clock unit tests for credentials, expiry and account separation. Reject malformed
  deployment settings and insecure SDP; verify unchanged secure SDP without UDP socket allocation.
  Test the HTTPS boundary and advertised routing in the network HLT.
