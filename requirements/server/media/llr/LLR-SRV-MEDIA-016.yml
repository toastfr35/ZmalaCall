verification: Exercise exact participant and role authorization, connected-state gating, upload bounds,
  normalization/orientation, lease expiry and stop/end/enrollment races with delayed decoding. Verify
  configuration capability and contact types. Inspect dialog-owned storage separately from public portraits.
