area: In-call photo sharing
scope: Core
text: The server shall expose temporary call photos only to authenticated enrolled peers of a connected
  App/Terminal dialog. Only the App peer may upload, renew or stop sharing. Uploads shall be limited to
  2 MiB and JPEG/PNG with at most 16 million decoded pixels, normalized to an oriented metadata-free JPEG
  of at most 1600 pixels per side. At most two uploads may decode concurrently and one per dialog. Stop
  and expired sender leases shall invalidate the image revision; call closure shall release dialog-owned
  bytes. Asynchronous upload completion shall recheck dialog identity, enrollment and revision. Photo
  operations shall not change voice/media negotiation. Configuration shall advertise support and app contact
  device types.
