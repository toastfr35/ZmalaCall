text: |
  Device APIs shall derive terminal identity from the bearer token rather than a terminal
  identifier supplied by the request. Status submissions shall have a bounded request size
  and validate state, registration, configuration version and device-list fields before
  replacing the last accepted status. The server shall supply the receipt timestamp and
  ignore a client-supplied last-seen timestamp. Malformed diagnostics shall leave the
  previous valid status intact.

  Configuration reads and accepted device-setting writes shall expose the same live
  contact presence and callback fields. When the caller already has the current
  configuration revision, a delta response shall still carry fresh presence/callback data.
  Live status changes shall not require artificial configuration-version increments.
  Diagnostics shall remain distinct from SIP reachability and media quality measurements.
