text: |
  Group edits shall accept at most 40 distinct existing members. Names shall contain 1 to 80 characters and be unique without case distinction. Descriptions shall contain at most 240 characters. The store shall contain at most 1000 groups.
verification: |
  Create, edit and delete groups at each boundary. Reject nonexistent or duplicate members without partial changes.
