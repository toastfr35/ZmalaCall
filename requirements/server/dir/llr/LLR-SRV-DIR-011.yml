text: |
  Administration shall create, edit and delete named groups and their memberships after
  validating referenced accounts. Groups shall have case-insensitively unique names of
  1–80 characters, descriptions of at most 240 characters and at most 40 distinct existing
  members; the store shall admit at most 1000 groups.
verification: |
  Exercise group edits and invalid account references without partial mutation.
