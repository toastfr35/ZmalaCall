text: |
  New terminal profiles and missing inactivity values shall default to 1800 seconds.
  The server and administration form shall accept 0 (Never), 30, 60, 120, 300, 600,
  1200 and 1800 seconds, reject other values atomically, and preserve explicit saved
  choices when another setting is changed or the server restarts.
verification: |
  Assert fresh and missing-value defaults, round-trip every permitted timeout,
  omitted-field preservation, persistence across restart and atomic invalid-value
  rejection. Check the administration form's default and option values.
