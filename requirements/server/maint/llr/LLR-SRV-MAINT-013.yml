text: |
  Only administrators shall enqueue commands. A command shall contain 1 to 8000 characters, include nonspace text and exclude NUL. Timeout shall be an integer from 5 to 120 seconds, defaulting to 60. Each terminal shall have at most ten queued or running jobs.
