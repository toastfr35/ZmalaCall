text: |
  A token shall claim and report jobs only for its current device serial. One device shall have at most one running lease. The lease shall be saved before claim acknowledgement and shall authenticate the result. Jobs with unknown original device ownership shall not run.
verification: |
  Claim repeatedly, exchange account associations and submit foreign or obsolete leases. Hold persistence before claim response.
