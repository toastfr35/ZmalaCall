text: |
  LAN browsers shall be able to perform first-time shared-password setup when no
  administrator password is configured. Passwords shall be 12 to 256 characters and stored
  as salted scrypt hashes in a private password file separate from ordinary configuration.
  A malformed password file shall fail closed rather than silently reopen setup.
  Deliberate password-file removal while stopped shall be documented as local recovery.

  Authenticated password changes shall require the current password, persist the new hash
  and revoke previous sessions. Sessions shall expire after eight hours and on restart,
  with at most 100 retained sessions. Session cookies shall be HttpOnly and SameSite
  Strict, and Secure under HTTPS. Login throttling shall limit attempts per address and
  globally. State-changing browser requests shall enforce same-origin checks; remote
  plaintext administration shall be refused when HTTPS administration is configured.

  Password changes/setup shall reject concurrent hash-update races. An explicitly
  requested bearer session may be returned to authorized API clients; ordinary browser
  login shall use cookies. Passwords, session tokens and terminal secrets shall not appear
  in public status or distribution artifacts.
