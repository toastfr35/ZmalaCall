text: |
  Unconnected calls shall expire after the destination ringing budget plus 30 seconds. Connected dialogs shall expire after four hours without signaling activity. Closure shall release relay resources and prevent late work from reviving the dialog.
verification: |
  Advance both timers and close during asynchronous offer or answer processing. Check that late work cannot forward or reconnect the call.
