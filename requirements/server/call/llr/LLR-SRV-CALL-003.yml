text: |
  SIP Digest shall verify account, realm, method, URI, qop=auth and response using a signed nonce valid for at most five minutes. Reused or decreasing nonce counts for the same user and client nonce shall be rejected.
verification: |
  Use valid and forged challenges, altered targets, expiry and repeated counts. Confirm failed authentication does not consume a valid count.
