text: |
  An authenticated registration shall require matching From/To account identity, record
  the actual UDP/TCP flow and at most one current Contact per account, clamp numeric
  expiry to 0–600 seconds and reject a nonnumeric expiry. A missing Contact shall query
  the registration; zero expiry or wildcard Contact shall deregister it.
verification: |
  Register, replace, query, expire and deregister contacts over both transports.
