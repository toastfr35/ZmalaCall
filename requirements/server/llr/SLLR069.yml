text: |
  Terminal configuration shall expose the owning SIP credentials/settings and the non-self
  account directory with permission flags, but no contact emails or other accounts'
  passwords/tokens. Reads and accepted local writes shall return consistent current
  presence/callback fields; same-revision delta responses shall still refresh live fields.
verification: |
  Compare full reads, delta reads and local-save responses while contacts change
  reachability.
