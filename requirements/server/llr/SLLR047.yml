text: |
  Reachable phone recipients shall receive basic UTF-8 SIP MESSAGE callback notices with
  the requester SIP address; acceptance shall be recorded once, failures retried no more
  often than once a minute and pending delivery checked every five seconds.
verification: |
  Reject then accept delivery, restart and recover reachability; distinguish SIP
  acceptance from human acknowledgement.
