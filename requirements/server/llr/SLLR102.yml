text: |
  VIDEOCALL_HOST shall accept an IPv4 address and reject other values; an accepted changed
  advertised address shall advance and persist the configuration revision. Initial
  automatic selection shall prefer a private nonvirtual LAN address, then another
  noninternal IPv4 address, falling back to loopback.
