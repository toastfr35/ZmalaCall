text: |
  Signals, listener errors and concurrent close requests shall share one shutdown
  operation that closes all HTTP/HTTPS listeners and SIP, drains accepted HTTP requests
  and then flushes changed state. Request draining shall not be represented as a bounded
  deadline for a stalled accepted request.
verification: |
  Delay an accepted mutation and invoke close twice; verify one SIP close and flush after
  request completion.
