text: |
  A server with no saved configuration shall initialize a terminal account, a phone
  account and a shared group with independently generated credentials; it shall select an
  available LAN IPv4 address for its initial host setting. The current compatibility
  defaults shall retain the initial term1 device ID windows-terminal and a PowerShell
  shell profile; deployments using Pi maintenance shall select sh/bash. These labels shall
  not imply that the Linux server runs Windows code.
verification: |
  Start in an empty isolated state directory and inspect generated account types, group
  membership and independent secrets.
