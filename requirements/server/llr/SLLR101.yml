text: |
  Authenticated administration shall be able to retrieve the selected terminal's LAN
  bootstrap JSON and select the legacy local-terminal account. Bootstrap writers shall
  update the private local artifact after relevant account/association changes; no
  selected account shall yield an unassigned bootstrap without a device token. This
  compatibility mechanism shall not replace Pi QR enrollment.
verification: |
  Select, rename and delete a terminal in isolated state; compare JSON/download and
  private bootstrap files and reject anonymous retrieval.
