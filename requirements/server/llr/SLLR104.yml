text: |
  The server shall accept only supported backup/configuration versions, a fixed file allowlist and valid account, profile, group, credential and history structures. It shall reject duplicate or unsafe filenames, missing referenced pictures, invalid picture dimensions/checksums, corrupt or oversized gzip/JSON payloads and prototype keys before changing live data. Compressed and expanded input shall each be limited to 64 MiB.
verification: |
  Reject malformed archives, path traversal, duplicate entries, missing photos, invalid settings, corrupt checksums and decompression bombs; validate legacy optional history fields from the deployed server.
