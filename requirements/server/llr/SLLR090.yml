text: |
  Installer preflight shall require Raspberry Pi 3 Model B/B+ or Pi 4 Model B, Raspberry
  Pi OS Lite 64-bit Debian Trixie, hostname zmalaserver, sudo/SSH access through physical
  Ethernet, a boot mount and at least 1 GiB free on /var. OS checks shall verify
  architecture, Pi-image provenance and Trixie identifiers; they shall not claim to detect
  the absence of extra desktop packages.
verification: |
  Probe compatible and incompatible hardware, OS, identity, network and storage fixtures.
