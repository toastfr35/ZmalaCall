text: |
  The server shall export a versioned gzip JSON file containing configuration, the configured administrator password hash, callback records, console history and all hash-named pictures. It shall snapshot the in-memory records together, include immutable photo bytes and checksums, bound output to 64 MiB expanded, and exclude sessions, runtime registrations, logs, recovery files and OS configuration.
verification: |
  Compare a round trip including account/device/SIP/SMTP credentials and pictures; verify secrets are absent from preview responses and included only in the administrator download.
