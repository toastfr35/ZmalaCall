text: |
  Restore shall require an unchanged configuration revision and no active calls, running console commands, pending callback deliveries or other HTTP requests. It shall gate new requests and calls, flush state, retain a private recovery backup, durably stage a restore journal and restart the supervised service. Before listeners start, it shall finish a pending apply or rollback; failed rollback shall prevent startup. Restored settings shall receive a revision greater than both current and backup revisions; network address and listener ports shall remain local. Restored queued/running commands shall be cancelled/lost and all leases discarded. Sessions and live registrations shall be recreated.
verification: |
  Simulate partial apply and interrupted rollback; verify retained recovery, no mixed-state service, revision advancement and non-replay of console jobs. Restore on the Pi server and check term2 settings, portraits, registration and media.
