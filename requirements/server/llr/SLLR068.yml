text: |
  Device settings requests shall identify the terminal from its bearer token, permit only
  language, auto-answer, framing, volume, portraits and TV timeout, and compare supplied
  prior values before committing changed values. An already-applied value shall not
  advance the revision, but acknowledgement shall still await persistence.
verification: |
  Try another device identity, unauthorized fields and conflicting prior values; verify
  atomic rejection.
