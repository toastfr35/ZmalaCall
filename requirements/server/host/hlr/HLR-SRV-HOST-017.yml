text: For the experimental image-managed server boot path, normal userspace startup shall depend
  on complete validated host-storage preparation. Given an already mounted marked read-only root,
  the helper shall validate its selected slot and actual block identity, locate data only on the
  declared sibling partition of that same parent device, initialize compatible identity and prepare
  volatile/persistent views. Unsupported or incomplete preparation shall fail without formatting,
  resetting identity or admitting normal startup. This path does not itself qualify full watchdog
  recovery, boot selection, application provisioning or system updates.
verification: Use actual temporary GPT-partitioned loop files in private Linux namespaces, controlled
  boot command lines and real block probes/mounts. Verify both selected roots, same-parent data,
  identity/application preservation, refusals and owned failure cleanup. Exercise the installed startup
  barrier separately. Record actual initramfs boot and physical power-loss evidence separately; synthetic
  namespace execution is not that qualification.
