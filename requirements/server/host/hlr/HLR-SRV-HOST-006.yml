text: |
  Authenticated administrators shall manually enable developer access for at most one
  remote terminal at a time and disable it without disrupting calling. Developer
  shell access through the server shall be restricted to its wired local subnets;
  the separate internet-reachable terminal tunnel endpoint shall not grant a server shell.
verification: |
  Exercise authorized and unauthorized controls, competing terminals, remote shell forwarding, local-subnet enforcement and revocation. Record physical-network evidence separately.
