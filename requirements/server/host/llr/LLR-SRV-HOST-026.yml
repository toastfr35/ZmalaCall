text: Before raw environment access, Linux boot control shall validate its marked read-only current
  image and declared slot, same-parent block topology, primary and backup GPT integrity, six-partition
  identities and both fixed disjoint environment ranges outside GPT metadata and partitions. Production
  access shall require the supported Pi 4 SD transport. Only fixed tool paths, keys, bounded commands,
  root-private generated configuration and nonblocking root-owned serialization shall be used; arbitrary
  devices, offsets, shell commands or operator configuration shall not select writes.
verification: Test GPT corruption, wrong parent/partition/transport, overlapping or changed geometry,
  symlinks/permissions, fixed command arguments, bounded output/timeouts and lock contention. Exercise
  actual environment tools on newly created fixture files/loops only; compare surrounding bytes before/after
  mutations.
