text: |
  Only authenticated administration shall enable or disable developer access.
  The server shall allow one selected terminal at a time, generate a new random
  password on activation, and deliver it only to the bound device through its
  HTTPS configuration refresh. Credentials shall remain outside ordinary backups
  and public status responses. The terminal account shall use a separate SSH
  listener restricted to remote forwarding to a server-loopback endpoint, without
  shell sessions. Deactivation shall stop all listener sessions, lock the account
  and remove its secret. Ordinary developer SSH shall accept only wired local
  source subnets for IPv4 and IPv6. Failures shall not silently claim success.
verification: |
  Exercise authorization, credential scope, process lifecycle and failure paths;
  verify the configured SSH and firewall boundaries and secret cleanup.
