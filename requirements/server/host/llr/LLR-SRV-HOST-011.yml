text: The image-managed storage helper shall bind only its fixed role-specific application state,
  network profiles/identity, Bluetooth state, SSH host-key storage, product operator configuration
  and server certificate state from the validated data mount. Saved machine identity and hostname
  shall be exposed read-only. Newly required directories shall use declared stable owners and private
  modes; existing data shall be preserved and incompatible ownership, modes or linked binding roots/parents
  shall be rejected rather than silently rewritten. Distribution configuration defaults shall remain
  from the selected root.
verification: Check exact per-role bindings and owner/mode/read-only specifications; exercise existing/new
  directory checks, preserved bytes and rejection of unlisted or linked state using controlled inputs,
  then verify real bindings in HLT.
