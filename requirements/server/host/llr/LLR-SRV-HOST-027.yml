text: The custom backend shall expose only the supported RAUC slot/state operations and explicit
  transaction control, reject malformed arguments before mutation, and return generic nonzero failures
  without saved environment contents. Setting eligibility shall not confirm health. The runtime boot-control
  policy shall forbid automatic installed-slot activation or unconditional mark-good; trial watchdog
  ownership shall remain unclaimed until the separate qualified health handover is implemented.
