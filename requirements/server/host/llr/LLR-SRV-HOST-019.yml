text: The early-boot helper shall identify the mounted root by kernel major/minor topology and validate
  its slot partition number, GPT entry identity and ext4 filesystem metadata against the boot contract
  and kernel PARTUUID. It shall select data only as the unique declared sibling under the same kernel
  parent, validate its block-node identity, GPT entry and filesystem metadata, and reject ambiguous,
  cross-parent, missing or mismatched state. It shall not select data through a global label search
  or an assumed physical device name.
verification: Control topology and bounded block-probe records to exercise valid Pi-style and loop-style
  names, matching parent/device identities and metadata. Reject aliases, duplicate/missing siblings,
  cross-parent records, changed block nodes, unsupported filesystem/GPT fields and kernel UUID mismatch
  before mounting data. Confirm real discovery on partitioned loop-image fixtures.
