text: The early-boot helper shall require Linux root, a bounded exact root-owned boot-layout policy
  matching the selected role, a marked read-only ext4 root and exactly one supported slot and PARTUUID
  root argument. It shall reject duplicate or malformed relevant kernel arguments, unsupported policies
  and conflicting mounts before data initialization or mutable-view preparation.
verification: Validate policy byte/type/role/owner bounds, kernel argument parsing, missing/duplicate
  keys, malformed UUIDs, platform/privilege guards and read-only mount admission. Assert refusal
  precedes data mount or identity initialization.
