text: |
  An explicit VIDEOCALL_HOST shall be an IPv4 address. A changed address shall advance and save the configuration revision. Initial automatic selection shall prefer a private nonvirtual IPv4 address, then another noninternal IPv4 address, then loopback. The service launcher shall prefer active eth0, then wlan0, then another global IPv4 address. It shall fail until an address exists.
verification: |
  Supply several interface lists and valid or invalid overrides. Check unchanged overrides do not create revisions.
