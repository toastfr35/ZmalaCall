text: |
  Signals and listener failures shall use one shutdown promise. Shutdown shall close HTTP and HTTPS listeners, stop SIP, stop starting callback deliveries, drain accepted HTTP requests and in-flight callback delivery results, and then flush required state.
verification: |
  Hold an accepted request, callback delivery and a write. Trigger concurrent close paths and check order, no new callback send, persisted delivery results and one SIP close. No finite drain deadline is assumed.
