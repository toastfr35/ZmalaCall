text: |
  Installation shall enable SSH over the wired interface and block Wi-Fi ingress to all
  configured SSH ports for IPv4 and IPv6, including traffic addressed to a wired IP. The
  guard shall precede SSH service exposure. Authenticated server administration shall
  expose current SSH state and allow wired SSH to be enabled or disabled persistently
  without stopping the HTTP, SIP or media services. Fixed-action privileged helpers shall
  apply the host policy; unavailable helper/status information shall not be reported as
  successful control.

  The Pi server shall use volatile journals capped at 64 MiB, zram rather than SD-backed
  swap, RAM-backed /tmp and noatime on root, with effective settings checked after reboot.
  Server state, portraits and private administrator credentials shall remain durable under
  the installed state layout. Operators shall export logs before reboot and back up
  persistent state separately. These settings reduce routine writes without making the
  filesystem read-only or guaranteeing SD-card lifetime.
