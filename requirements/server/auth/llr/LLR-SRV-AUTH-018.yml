text: |
  A one-minute login window shall allow at most five attempts per address and thirty attempts globally. Excess attempts shall receive an explicit retry response. Expired address counters shall be removed.
verification: |
  Exercise both limits, many addresses and window expiry. Confirm rejected attempts do not perform password hashing.
