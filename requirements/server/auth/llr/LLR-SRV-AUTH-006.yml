text: |
  Sign-in shall enforce both per-address and global attempt throttling and return an
  explicit retry response when limits are reached. The one-minute attempt windows shall
  allow at most five attempts per address and thirty globally before rejection.
verification: |
  Burst incorrect logins from one and multiple addresses and verify throttling and later
  recovery.
