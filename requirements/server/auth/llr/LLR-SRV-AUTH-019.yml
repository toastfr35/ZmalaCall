text: |
  Browser login shall issue a session cookie. An explicit authenticated API-session request may also return a bearer credential. Sign-out shall revoke that session; successful password replacement shall revoke all sessions.
verification: |
  Log in both ways, sign out and replace the password. Check invalidation against administrator endpoints.
