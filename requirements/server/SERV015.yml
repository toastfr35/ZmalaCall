text: |
  Accounts, groups, settings, pictures, callbacks and console history shall persist across
  server restarts. Configuration and jobs shall be scoped to the authenticated terminal.
  Credential-bearing bootstrap and setup artifacts shall remain private. Runtime snapshot
  writes shall be asynchronous and ordered per file, with at most one active write and one
  latest pending snapshot per writer rather than an unbounded queue of serialized
  snapshots.

  Each mutation shall await the writers it changes before success. Unrelated read-only
  management requests shall remain available during a console or callback save failure.
  Subsequent commit barriers shall retry failed latest snapshots. /health shall report
  process liveness; /ready shall return 503 while a latest snapshot has a known unresolved
  failure and 200 after recovery. Readiness shall not imply successful SIP registration,
  usable media or general disk health.

  Each snapshot shall use atomic replacement. Separate
  configuration/callback/console/bootstrap writes shall not be described as a cross-file
  transaction or a power-loss fsync guarantee. Backup/restore instructions shall account
  for those separate files and terminal revision checks; restoring an older server
  snapshot shall not silently disable terminal rollback protection.
