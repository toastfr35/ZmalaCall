text: |
  Authenticated portrait uploads shall accept supported JPEG/PNG images within the 2 MiB
  request limit and validate dimensions before conversion. Either side shall be at most
  8192 pixels and the image at most 16 million pixels. Linux conversion shall use
  Python/Pillow to generate the 480-pixel portrait derivative rather than depend on
  Windows image tools.

  Photo work shall limit admission to ten pending uploads and conversion to two workers,
  rejecting excess requests explicitly. Identical concurrent conversions shall share work.
  Derived files shall be published atomically under content-derived names; failed
  conversion shall not expose incomplete portraits or block unrelated requests. These
  active-work limits shall not be represented as garbage collection of old unreferenced
  photos.
