text: |
  The requester or administrator shall be able to cancel a pending request. A connected call in either direction shall complete requests for the pair. Permission removal, account deletion or requester conversion shall cancel invalid requests; rename shall preserve valid requests.
verification: |
  Exercise both cancellation authorities, either call direction and account/group changes. Check pending and completed views.
