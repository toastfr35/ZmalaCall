text: |
  Wi-Fi codes shall validate SSID, WPA or open security, password and hidden status. SSIDs shall contain 1 to 32 UTF-8 bytes without control characters. Standard codes shall escape reserved characters. Non-ASCII or excessive standard payloads shall use the versioned compact encoding. Submitted Wi-Fi secrets shall not be saved.
