text: |
  Administration shall configure each terminal language, camera, microphone, speaker,
  audio processing, video resolution/frame rate, automatic framing, speaker volume,
  portrait count, TV return timeout and command shell. Account names, pictures and
  credentials shall be managed on the Accounts page. Language shall affect the terminal
  display, not the English admin interface.

  Video choices shall be 480p (640 by 480), 720p (1280 by 720, default) and 1080p (1920 by
  1080), independently combined with 10, 15 (default), 20, 25 or 30 fps. Targets shall not
  imply guaranteed achieved frame rate. Audio profiles shall be normal or speech. Framing
  shall be a boolean, default off; speaker volume an integer from 0 to 100, default 50;
  portrait count 3 or 5, default 3; TV timeout 0 (Never), 30, 60, 120, 300, 600 or 1200
  seconds, default 30. Invalid types and unsupported choices shall be rejected before
  mutation.

  The server shall configure auto-answer on/off and an integer delay from 5 to 600
  seconds. Local Settings shall offer the discrete choices specified in TERM026. Ringing
  cleanup and terminal timers shall allow the configured automatic-answer delay plus
  grace. Command shell choices shall include Windows PowerShell, PowerShell 7 and Command
  Prompt for Windows terminals, and sh/bash for Linux; terminals shall explicitly reject
  an incompatible shell for execution.

  An authenticated device shall update only its own language, auto-answer enable/delay,
  framing, speaker volume, portrait count and TV timeout. Writes shall compare the
  previous values of edited fields, reject conflicts, preserve other settings and
  acknowledge only after persistence. An already-applied value shall not advance the
  configuration revision, but its response shall still await persistence. Applying the
  configuration on terminals is specified in TERM037.
