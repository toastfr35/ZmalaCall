text: The server shall bind each push token to its authenticated App enrollment, accept replacement or
  removal only from that bearer, and expire unused tokens after 30 days. Tokens shall be stored separately
  from exported backups; the FCM sender credential shall remain server-side. FCM HTTP v1 requests shall
  use scoped service-account OAuth, sharing one bounded refresh across concurrent sends and permitting
  retry after a failed or malformed refresh. A late authorization rejection shall not clear a newer
  access token. Requests shall use high-priority data messages containing an enrollment HMAC over
  event, call ID, caller ID, deadline and device ID. Invalid destinations shall be removed. Push-eligible
  Apps shall be callable in live availability without a SIP registration. Only authorized INVITEs shall
  wait for fresh registration, at most 24 active or waiting calls and one per participant, for at most
  60 seconds. Resume shall recheck permissions, enrollment and caller credentials. Authenticated matching
  CANCEL, recipient decline, timeout, send failure and shutdown shall invalidate waiting work; cancellation
  shall dismiss the remote alert. Restore shall reject waiting calls.
verification: Assert token ownership, rotation, expiry, invalidation and canonical payloads; inspect scoped
  signed OAuth and data-only FCM sends. Check shared concurrent refresh, malformed/failed refresh
  recovery and late rejection of a previous access token. Exercise fresh registration, foreign and valid CANCEL, duplicate
  IDs, recipient decline, expiry, changed identity/permissions, failure, shutdown and idle restore guarding.
  Qualify Google delivery separately.
