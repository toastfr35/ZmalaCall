text: |
  Configuration, callback and console snapshots shall replace their individual JSON files atomically. Each writer shall retain at most one active write and one latest queued snapshot. Ordinary snapshots shall remain independent per-file operations.
verification: |
  Hold writes, queue multiple complete revisions and inspect order, coalescing and atomic replacement. Ordinary writes do not fsync or form a cross-file transaction.
