text: |
  The administrator overview shall provide download, file validation/summary and explicitly confirmed replacement actions usable on desktop and phone screens. Backup APIs shall use the existing administrator, Host, Origin and session checks and allow at most one backup operation at a time. Restore shall require a confirmation marker and checked configuration revision, report restart progress and persistent restored/rolled-back status, and explain private-file handling, restored administrator credentials, network exclusions and command non-replay.
verification: |
  Test anonymous/device rejection, missing confirmation, stale revisions, busy service responses and maintenance gating; inspect desktop and phone layouts, download a backup and verify restore/login behavior.
