text: |
  A Windows GUI/headless installer shall default to zmalaserver.local and user
  zmalaserver, obtain explicit installation confirmation and validate SSH host
  identity/connectivity, Raspberry Pi OS Lite 64-bit Debian Trixie, supported Pi hardware,
  wired access and available storage before deployment. Supported boards shall be
  Raspberry Pi 3 Model B/B+ and Pi 4 Model B. It shall report incompatible systems and
  failed commands rather than treating them as a completed install.

  Installation shall verify package checksums, install dependencies and automatic startup,
  and keep server HTTP/SIP/media available on all IPv4 interfaces. A single remote install
  job shall survive connection loss; overlapping installs shall be rejected. Wired SSH
  shall remain enabled during installation. The installer shall verify application/service
  health and low-write configuration, including after the required reboot, before
  reporting completion.

  Optional migration shall preserve accounts, credentials, portraits and persisted server
  data, including the separate administrator password state, without replaying in-flight
  console jobs. Migration shall refuse accidental replacement of existing live state.
  Application updates shall preserve /var/lib/zmalacall-server and private credentials.
  Release switching and startup-failure rollback shall distinguish application releases
  from OS dependency/configuration changes; a restored symlink shall not be described as
  full system rollback. SSH controls and storage policy are specified in SERV023.
