text: |
  USB power switching shall remain opt-in and disabled by the regular installer. On the
  supported Pi 4 topology, external ports including camera and charger shall be treated as
  a shared power domain. Power may be removed only after five minutes without camera use
  and a fresh remote battery reading strictly above 25 percent. Active
  calls/ringing/setup/settings, low or unknown battery and stale application status shall
  retain or restore power.

  The helper shall refuse shutdown when another peripheral or open media handle is
  detected. It shall deauthorize C20 interfaces before switching off. Wake shall wait for
  video/audio enumeration, refresh SDK device lists on the owning thread and reapply
  volume before media is treated as ready. Blocking hub operations shall run on one
  worker; failure and application stop shall favor power-on. The feature shall not be
  presented as suitable for USB storage or safe detection of equipment attached while
  ports are unpowered.
