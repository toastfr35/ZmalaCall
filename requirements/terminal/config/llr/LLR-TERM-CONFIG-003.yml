text: |
  Holding red continuously on the carousel for ten seconds shall open Settings, with
  progress shown after two seconds. Early release, another button, focus/disconnect
  changes or an incoming call shall cancel entry; red shall remain immediate for
  decline/hangup. Repeated key-down shall not restart the timer; short idle red actions
  shall occur on release.
verification: |
  Test threshold boundaries, cancellation causes and red during ringing/connected calls.
