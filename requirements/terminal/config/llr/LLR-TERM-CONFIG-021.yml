text: |
  The local editors shall provide these choices:
  - Language: a supported language.
  - Automatic answer: Never, 10, 30, 60, 120, 300 or 600 seconds.
  - Automatic framing: on or off.
  - Speaker volume: an integer from 0 through 100 percent.
  - Portrait count: 3 or 5.
  - TV return: Never, 30, 60, 120, 300, 600 or 1200 seconds.
  The default TV return interval shall be 30 seconds.
verification: |
  Enumerate every editor option and check defaults, numeric limits and rejection of
  unsupported values.
