text: |
  Confirmed reset shall stop media and maintenance work and invalidate pending
  responses. It shall remove this profile’s enrollment, cache, notifications and
  setup-test results. It shall preserve other profiles, server accounts and the
  Bluetooth bond. Setup shall require the remote test again.
