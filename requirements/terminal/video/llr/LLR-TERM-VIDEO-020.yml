area: In-call photo sharing
scope: Core
text: During a connected call, when the server advertises photo sharing, the terminal shall fetch current-call
  photo state and JPEG bytes using its enrollment authorization off the UI thread. It shall display the
  image with preserved proportions over both video views without terminating or renegotiating media. Stop,
  call change/end or sender-lease expiry shall remove the layer and reveal the retained video surfaces.
  Late results for another call shall be discarded, and failed requests shall not extend the display lease.
  Images shall be bounded to 2 MiB and 1600 pixels per side.
