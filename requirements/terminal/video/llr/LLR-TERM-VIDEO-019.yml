text: |
  The Pi shall defer C20 camera open, format and stream controls until its C20
  microphone PCM has remained RUNNING for 750 ms. Camera size negotiation shall
  not open the device. Waiting and camera initialization shall run on the camera
  worker, without blocking the UI or media ticker. The readiness wait shall use
  a five-second deadline and a 20 ms polling interval, checking cancellation
  before each poll. Failed initialization shall release acquired camera resources.
verification: |
  Inject microphone state transitions, monotonic time, cancellation, thread
  creation failure and V4L2 failures. Assert no camera I/O before the stable-ready
  interval, a reset interval after readiness loss, the timeout/cancellation bounds,
  resource cleanup and camera size negotiation without opening hardware.
  On the physical Pi, repeat the staged native-rate audio/MJPEG sequence and
  require completed audio and camera data for every requested cycle. Record the
  requested/completed cycle count independently from native boundary evidence.
