text: |
  The terminal shall accept 640 by 480, 1280 by 720 and 1920 by 1080 video targets. It
  shall accept 10, 15, 20, 25 and 30 frames per second. The default shall be 1280 by
  720 at 15 frames per second. Legacy 360p values shall become 640 by 480. Actual
  delivery can be lower than the target.
verification: |
  Inspect native requests for each target and legacy normalization. Use measured
  frames, not configured values, to assess actual delivery.
