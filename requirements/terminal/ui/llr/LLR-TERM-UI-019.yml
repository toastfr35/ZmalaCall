text: |
  The Pi compositor shall synchronize display presentation. The Pi 4 driver override
  shall apply only to its supported driver path. Carousel animation shall use elapsed
  time and absolute 60 Hz deadlines. Missed deadlines shall be skipped rather than
  added as delay.
