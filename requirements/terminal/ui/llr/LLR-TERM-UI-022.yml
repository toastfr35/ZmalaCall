text: |
  Rendering caches shall enforce entry and pixel-byte limits. Byte budgets shall be 8
  MiB for text, 32 MiB for portraits and 24 MiB for source pictures. Icons shall use 2
  MiB and Pi flattened backgrounds 8 MiB. Oversize objects may render without
  retention. Eviction shall preserve displayed images and release unused native
  resources.
verification: |
  Force eviction with small budgets, replace images and close renderers. Check
  retained byte counts and displayed image lifetime, not total process memory.
