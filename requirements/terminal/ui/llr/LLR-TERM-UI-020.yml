text: |
  Portrait loading shall use one worker with at most 40 queued jobs. Before decoding,
  it shall reject images above 2 MiB, 4096 pixels per side or 4,194,304 pixels. Only
  validated results shall replace cached files.
verification: |
  Queue more than 40 jobs and supply images at and above each size limit. Check
