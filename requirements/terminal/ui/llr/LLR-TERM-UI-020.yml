text: |
  Portrait loading shall use one worker with at most 40 queued jobs. Before decoding,
  PNG/JPEG input shall be rejected above 2 MiB, 4096 pixels per side or 4,194,304 pixels. Only
  validated results shall replace cached files.
  Published GIF portraits shall be 480 × 480 pixels and at most 16 MiB, 2–72 frames, 20–2000 ms per frame and 5 seconds total. Validate their frames in the portrait worker before atomic cache publication.
verification: |
  Queue more than 40 jobs and supply images at and above each size limit. Check
  rejection before decode and atomic publication.
