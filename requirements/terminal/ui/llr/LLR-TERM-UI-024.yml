text: |
  The Pi text renderer shall use Pango and Cairo with suitable fonts for Unicode
  shaping and right-to-left scripts. It shall preserve supplied names and keep text
  within the available layout. An overlong settings label shall use an ellipsis if it
  cannot fit after font reduction.
