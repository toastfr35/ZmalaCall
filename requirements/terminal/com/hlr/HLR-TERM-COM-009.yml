text: When secure relay mode is configured, the terminal shall establish audio and video calls through
  a network that blocks forwarded UDP but permits direct TLS connections to the configured TCP port
  endpoints (443 by default, with distinct configurable ports for one public IP). It shall authenticate these endpoints and shall not fall back to an unencrypted
  connection.
verification: Run the isolated two-home network matrix with UDP blocked at either or both homes.
  Check decoded media in both directions and TLS authentication.
  Check same-revision credential renewal through the UI poll controller, including deferred application during a call.
