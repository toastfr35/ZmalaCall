text: In secure relay mode, the terminal shall use SIP TLS and TURN TLS on the configured ports (443 by default), local trusted
  CA certificates, certificate name checks, ICE relay selection and mandatory SRTP. It shall reject
  invalid or expired relay credentials and require HTTPS enrollment. It shall apply changed credentials
  only while idle, including renewal delivered at an unchanged configuration revision. The TURN stream parser shall retain incomplete frames and remove ChannelData padding
  before delivering each complete frame. The Pi shall load the parser correction only with the matching
  installed SDK version.
  TURN TLS writes shall retain a frame through short writes and temporary socket backpressure.
  Socket callbacks shall use the operating system error code, distinguish temporary
  read/write backpressure and interruption from a disconnected peer, and pass
  retryable results to TLS without closing a healthy connection.
  A write that cannot complete within three seconds shall fail and shut down the connection so a
  partial frame is not followed by another frame on the same stream.
verification: Unit-test configuration rejection, native policy calls, encryption and resource cleanup.
  Advance the clock to credential expiry on an already running core; reject new dial and answer before opening media.
  Deliver renewed credentials at the same revision; require polling to schedule idle engine replacement.
  Accept separate valid SIP and TURN ports for a shared public IP; reject out-of-range or malformed ports.
  Feed fragmented and coalesced TURN frames at every byte boundary; compare exact payload bytes and
  lengths.
  Inject short writes, WANT_READ/WANT_WRITE, timeout, peer closure and poll failure; assert exact
  output bytes, stable retry buffers and bounded failure.
  Fill a real local socket buffer to EAGAIN and read an empty nonblocking socket;
  require retryable TLS results, successful retry bytes and distinct peer closure.
