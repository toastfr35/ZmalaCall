text: |
  After server enrollment, TV checks shall run before normal use, with media startup and
  idle restoration paused. The first check shall explain the test and wait for GREEN
  consent, request standby, allow a bounded wait for the power report, wait three seconds,
  then attempt wake even if standby acknowledgment failed. The user shall confirm with
  GREEN or reject with RED; rejection shall offer retry or continuation without claiming
  success.

  The input check shall wait up to 30 seconds for an observed non-terminal input. It shall
  select the terminal, wait three seconds, restore the observed other input, wait three
  seconds and select the terminal again. It shall explain manual recovery if the screen
  does not return, then ask whether automatic switching happened. Failure shall offer
  retry/help or continuation; unknown prior routing shall not be fabricated. Samsung help
  shall cover network-control permission and verified input selection; Sony help shall
  describe BRAVIA Sync without claiming hardware qualification.

  Attempts, individual power/input outcomes and TV identity/physical-address metadata
  shall persist. Failed persistence shall keep the check pending; interrupted setup shall
  resume. Changed TV binding shall invalidate incompatible saved results. Reset shall
  clear the results. Power and source behavior shall be gated independently by their
  confirmed outcomes. Runtime restoration is specified in TERM038.
