text: |
  When a requested contact becomes available and both sides can call, the idle terminal
  shall select it and display a ten-second notice once per request, without automatic
  dialing or interruption of ringing/call/confirmation. The notice shall wait for five
  seconds without input before selecting the contact.
verification: |
  Vary presence and UI state through repeated callback polls.
