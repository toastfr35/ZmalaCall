text: |
  Media-device/profile changes shall wait until idle; applied revision shall be reported
  only after successful engine setup. A failed engine shall be released and retried
  against the latest desired configuration after a five-second idle backoff.
verification: |
  Change media during a call and inject setup failures followed by a newer desired
  revision.
