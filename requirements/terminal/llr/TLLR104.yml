text: |
  The Wi-Fi icon shall always represent wireless status rather than Ethernet/server
  reachability; terminal/network/server and remote indicators shall remain independently
  derived. Settings shall suppress the status icon strip. Icons shall use antialiased
  strokes at display size, status colors and the compact terminal/network/server arrow
  sequence.
verification: |
  Disconnect Wi-Fi with Ethernet/server active, then stop only the server and inspect icon
  states.
