text: |
  Jobs shall enforce their 5–120 second timeout and cancellation/reset/shutdown shall
  terminate owned subprocess groups; command environment and directory changes shall not
  become state for later jobs. Installed systemd service cleanup shall cover the control
  group; standalone process-group cleanup shall not claim supervision of descendants
  detaching into new sessions.
verification: |
  Spawn child/grandchild processes and compare subsequent job environment after
  timeout/cancellation.
