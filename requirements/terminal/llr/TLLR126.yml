text: |
  When no usable capture microphone exists, call parameters shall disable outgoing audio
  capture while preserving available receive playback/video. Capture availability shall be
  reevaluated for the next call after reconnection rather than remaining permanently
  disabled.
verification: |
  Make a call without capture, reconnect the microphone and verify the next call restores
  sending; inspect playback availability independently.
