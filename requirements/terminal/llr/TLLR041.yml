text: |
  An incoming call shall require a permitted contact in the configured SIP domain and a
  valid server proof tied to call/caller identity; unauthorized calls shall not open
  normal ringing UI.
verification: |
  Inject unknown callers, wrong domains and tampered or missing proofs.
