text: |
  The Pi shall apply 640×480, 1280×720 or 1920×1080 targets with 10/15/20/25/30 fps and
  default 720p/15 fps; legacy 360p shall normalize to 480p. These settings shall be
  targets, not guarantees of delivered resolution or frame rate.
