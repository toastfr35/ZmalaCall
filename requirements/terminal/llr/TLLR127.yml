text: |
  When shared USB power control is enabled, the status strip shall show a compact
  antialiased USB symbol immediately left of the remote battery icon. It shall use
  mint for confirmed on, grey with a slash for confirmed off, and a grey question
  mark for transitioning or unknown power. Confirmation shall use hub port status,
  independently of camera enumeration or SDK readiness. Settings shall continue to
  hide the status strip; terminals without USB power control shall omit this icon.
verification: |
  Inspect screenshots for powered, off and unknown states and matching icon scale,
  spacing and centered call heading. Simulate an unsuccessful port transition and
  successful power restoration with absent camera; verify distinct power/readiness.
