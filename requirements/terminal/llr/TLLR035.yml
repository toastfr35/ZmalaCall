text: |
  The terminal shall use the server-selected language for normal UI and local settings;
  pre-enrollment installation screens shall use English, and help without a
  selected-language translation shall fall back to English. Core prompts shall use the 95
  included language catalogs; detailed TV help currently provides English and French,
  without claiming every diagnostic is translated into all catalog languages.
verification: |
