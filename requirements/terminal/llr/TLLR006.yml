text: |
  The carousel shall support the configured 3- or 5-portrait layout, default to 3 and use
  3 positions when fewer than five contacts exist; the selected portrait shall be twice
  the adjacent portrait width and height. Only contacts whose can_call permission is true
  shall appear in the carousel; the five-portrait layout shall fit 720p while retaining
  navigation-arrow space.
verification: |
  Render zero through six contacts in both settings and compare dimensions and empty-state
  behavior.
