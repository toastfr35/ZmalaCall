text: |
  Only a permitted incoming call cancelled by its caller while still ringing shall add a
  missed-call notification; answered, locally declined and outgoing calls shall not.
  Cancellation shall stop ringtone/countdown and return to idle.
verification: |
  Exercise each termination reason and inspect saved counts and UI.
