text: |
  Remote status shall be collected off the UI thread approximately every five seconds and
  expire after twenty seconds; disconnected, unknown or stale reports shall not be shown
  as fresh battery/connection facts. Diagnostics shall distinguish unavailable Bluetooth,
  missing pairing, blocked/disconnected devices and connected devices lacking input
  wherever observable.
verification: |
  Delay the worker, disconnect and feed unsupported reports while advancing time.
