text: |
  The battery icon shall appear left of Bluetooth. Its color shall be red at 0–10
  percent, amber at 11–20 percent and green above 20 percent. A validated charger-
  connected report shall add a lightning mark, including at full charge. Unknown or
  stale readings shall show unknown state.
verification: |
  Render boundary battery values, invalid reports, stale readings and connected
  charging power at 100 percent.
