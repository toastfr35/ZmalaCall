text: |
  Vertical motion shall adjust volume only while middle is held. Each 64 relative
  units shall change volume by two percentage points. Upward motion shall increase
  volume. The value shall remain from 0 through 100 percent. Horizontal or unheld
  motion shall have no effect.
verification: |
  Apply positive, negative, partial and large motion. Release and re-hold middle.
  Check direction, remainder reset and limits.
