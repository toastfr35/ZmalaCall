text: |
  The normal terminal screen shall show compact terminal, Wi-Fi and server connectivity
  indicators with arrows and status colors, plus Bluetooth and remote battery icons. Wi-Fi
  status shall describe the wireless connection even when Ethernet provides server access.
  Server reachability shall not imply Wi-Fi association. Local Settings shall hide these
  indicators as specified in TERM026.

  Icons shall use anti-aliased strokes at the display dimensions. The battery icon shall
  sit to the left of the Bluetooth icon. The Presenter+ battery icon shall show a
  lightning bolt when the remote reports an attached charger, including at full charge;
  this indicates charger attachment, not measured charging current. Status shall be read
  off the UI thread and refreshed every five seconds. Unknown, disconnected or stale
  status shall not imply charging or a known battery level.

  Battery levels shall use green above 20 percent, amber from 11 through 20 and red from 0
  through 10. A status sample older than 20 seconds shall be treated as stale.
