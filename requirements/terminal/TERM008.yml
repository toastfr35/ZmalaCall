text: |
  The terminal shall show incoming video during connected calls, allow RED to hang up and
  ignore carousel navigation during a call. Late call events shall not reverse a requested
  hang-up or affect another call.

  A small local-camera view shall appear at the bottom right during video calls. The
  remote video and local preview shall have separate native display contexts with
  lifetimes covering their use by the engine. The Pi preview shall share the outgoing
  camera capture instead of opening a competing camera stream. Preview image reduction is
  specified in TERM032.
