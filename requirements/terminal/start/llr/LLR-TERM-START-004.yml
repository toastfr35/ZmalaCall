text: |
  During supported Plymouth boot stages, the terminal shall show the Zmala family-
  word-cloud artwork. Once local filesystems are mounted, a stable host helper shall
  send the version from the durable confirmed release metadata to Plymouth, which
  shall overlay it in the bottom-right corner with an inset margin. The version
  shall follow application confirmation and rollback without changing the artwork
  or rebuilding boot images. Missing or invalid metadata or an unavailable Plymouth
  daemon shall omit the label without blocking startup. A recovery console shall
  remain available.
verification: |
  Check theme configuration and inspect a Pi boot. Firmware frames before Plymouth are
  outside this check.
  Unit-check confirmed identity validation, bounded command failure and boot ordering.
  Visually check readable bottom-right placement at supported display resolutions.
