text: |
  An incoming call shall cancel pending outgoing confirmation and unfinished page
  actions. The terminal shall decline a second incoming call while it owns an
  active call. Events or preflight responses from an older call shall not dial,
  end or replace the newer call.
verification: |
  Deliver late preflight responses and native events across incoming calls. Check
