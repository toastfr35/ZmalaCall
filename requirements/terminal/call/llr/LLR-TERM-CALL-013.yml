text: |
  Incoming ringing shall show the caller portrait and animated call feedback. Green
  shall answer and red shall decline immediately. Guidance on the Pi
  shall show distinct green answer and red decline controls, with check/cross symbols
  and localized action labels, never a keyboard key.
  Automatic answer shall show its
  configured countdown alongside both controls and remain cancellable until answer starts.
verification: |
  Exercise manual answer, decline and automatic countdown, including a red press
  before expiry. Check that Pi guidance identifies both remote buttons with matching colours,
  symbols and localized actions. Confirm both remain visible during countdown
  and disappear outside incoming ringing; Windows retains its keyboard hint.
