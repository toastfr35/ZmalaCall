text: |
  An incoming call shall require a permitted contact in the configured SIP domain. It
  shall also require valid server proof bound to the call and caller. A rejected
  caller shall not open normal ringing pages.
verification: |
  Vary contact permission, domain, proof, caller and call identity. Check rejection
  before normal ringing.
