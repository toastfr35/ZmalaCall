text: |
  Green on an available contact shall open its picture/name confirmation; a second
  distinct green press shall revalidate availability/permission before dialing.
  Cancellation shall retain carousel selection and a held key shall not confirm twice. Any
  other key shall cancel the confirmation.
verification: |
