text: |
  Pi first startup shall require the camera and verified remote before QR enrollment.
  Wi-Fi setup shall join the scanned network; existing-link mode shall remain an explicit
  development alternative. Successful Wi-Fi enrollment shall stop scanning for an
  unskippable ten-second confirmation, then start server QR scanning. The server QR shall
  supply the server URL, terminal identity and token; the installer shall not hardcode
  terminal identity. Authentication and validated configuration shall precede commitment
  of enrollment. Invalid data, wrong credentials or connection failure shall leave the
  current step active with an explanation and retry scanning. Installation instructions
  shall be English until server enrollment sets the selected language. Localized
  TV-control checks shall follow enrollment before normal use. The Linux preview shall
  remain contained without obscuring prompts. Reset shall retain the prior language
  preference for later configured UI, but shall repeat installation checks.
