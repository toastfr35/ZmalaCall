text: |
  The Pi terminal shall select the Nuroum C20 by device identity, including after USB
  re-enumeration, rather than trusting a stale device index. Missing C20 video/audio shall
  produce explicit unavailable-device behavior instead of silently selecting another
  camera or HDMI audio. Video capture shall request C20 MJPEG at the configured dimensions
  and use the Pi H.264 encoder; receive decoding shall use the supported software path.

  Supported targets shall be 640 by 480, 1280 by 720 and 1920 by 1080, at 10, 15, 20, 25
  or 30 fps, with 720p15 as the fresh default. Legacy 360p configuration shall map to
  480p. Upload allowance shall be ceil(base times fps divided by 15), using base values
  700, 1500 and 2500 kbit/s respectively. Receive allowance shall be 2000, 4000 and 6000
  kbit/s respectively, independent of local sending FPS. These are codec bandwidth
  allowances, not guaranteed throughput or image quality.

  C20 audio shall use its microphone and speaker for calls and audible call feedback. The
  speech profile shall use the native 16 kHz microphone processing rate while preserving
  the 48 kHz Opus clock/playback path; normal processing shall remain selectable. Echo
  cancellation shall use the configured 500 ms window and automatic delay. Packet counters
  shall not be treated as proof of audible speech or echo quality.
