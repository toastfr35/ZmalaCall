text: |
  Reset confirmation shall be accessible only through the Reset entry in local Settings.
  GREEN shall open the confirmation page, a separate GREEN press shall reset, and RED
  shall keep configuration and return to Settings. A held GREEN shall not both open and
  confirm reset. Holding RED on the carousel shall open Settings, never reset directly.
