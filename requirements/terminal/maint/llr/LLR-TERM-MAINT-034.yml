text: The updater shall read bounded non-symlink private enrollment without constructing
  application configuration or media owners. It shall send bearer credentials only
  to the enrolled HTTPS server with redirects and environment proxies disabled, bound
  responses, throttle unchanged reports and immediately report phase transitions.
  Public download transport shall remain unauthenticated. Earlier servers without
  the feed endpoint may fall back to public manifest discovery.
verification: Check origin/header placement, redirect refusal, size/mode/symlink rejection
  and integrated reporter phase/throttling/failure behavior with disposable enrollment
  and transport fixtures.
