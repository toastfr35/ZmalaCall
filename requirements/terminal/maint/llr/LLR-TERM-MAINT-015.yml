text: |
  Each job shall enforce its configured timeout from 5 to 120 seconds. Cancellation,
  reset and shutdown shall terminate owned process groups. Job environment and
  directory changes shall not affect later jobs. The installed service shall clean its
  control group.
verification: |
  Run timed and cancelled isolated jobs with children. Check cleanup and independent
  subsequent execution. Standalone cleanup does not supervise children that detach
  into new sessions.
