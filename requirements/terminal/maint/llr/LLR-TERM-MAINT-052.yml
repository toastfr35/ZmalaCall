text: The authored selector shall clear stale outputs, require supported role/schema and valid decision
  fields, select only an eligible confirmed system or its distinct eligible trial, and persist consumption
  of the single trial attempt before selecting that trial. Failed consumption shall select the confirmed
  system. An already consumed trial shall fall back to the confirmed system without another environment
  write. Invalid decision fields shall produce no boot target.
verification: Run the actual authored shell-compatible selector with controlled environment operations
