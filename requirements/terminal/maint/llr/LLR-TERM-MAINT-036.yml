text: For image-managed host storage preparation, the helper shall accept only a bounded, root-owned
  regular supported layout profile for the selected server or terminal role, a read-only marked image
  root, a separate writable validated data mount and a RAM working area. It shall reject linked policy
  parents, unsupported or mismatched schemas/roles/owners, unsafe paths and invalid saved machine
  identity or hostname before mounting mutable views. Physical data-device selection and first identity
  creation are caller preconditions, not performed by this helper.
verification: Validate valid and malformed profiles and mount facts, size/schema/role/UID bounds,
  links, ownership, identity formats and unsupported roots using controlled metadata and temporary
  files; assert refusal precedes mount or readiness operations.
