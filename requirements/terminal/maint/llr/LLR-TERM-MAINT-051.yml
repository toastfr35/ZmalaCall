text: Candidate staging shall require the booted confirmed system, a distinct eligible inactive slot,
  no existing pending trial and a fresh transaction. Confirmation shall require the currently booted
  consumed trial and the matching transaction and generation; generic eligibility changes shall not
  confirm a trial. Linux mutations shall compare the expected complete prior state under serialization,
  advance a bounded generation, and verify the committed state by readback. Refusal or ambiguous
  writes shall not report successful activation or confirmation.
verification: Assert staged, consumed, confirmed, failed and cancelled transitions; reject active-slot
  staging, stale transaction/generation, unconsumed or wrong-slot confirmation and generation exhaustion.
  Inject stale reads, write failures and mismatched readback; verify conservative results and retained
  confirmed state.
