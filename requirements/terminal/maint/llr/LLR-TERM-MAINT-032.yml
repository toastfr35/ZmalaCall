text: After the application stops, the updater shall make a durable private same-filesystem
  copy preserving data ownership, modes and symlinks without following external targets.
  Passive trials shall not change persistent data. Rollback shall atomically exchange
  the live directory and checkpoint and use a durable transaction marker to prevent
  repeated exchanges; a committed confirmation shall prevent restoration.
verification: Check original bytes, nested files, symlink preservation, mutation rejection,
  repeated restoration, committed confirmation and unsafe checkpoint directory rejection.
