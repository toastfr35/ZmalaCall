text: The image-managed storage helper shall prepare a fresh RAM-backed configuration overlay from
  the selected root defaults, a bounded RAM-backed variable-state view from that root seed and a
  bounded RAM temporary directory. It shall retain package status and package alternatives in the
  selected read-only root rather than the shared data mount. It shall not reuse a saved configuration
  upper layer or package database from another root generation. Ordinary journals shall use volatile
  storage with a 32 MiB runtime budget and 4 MiB file limit.
verification: Assert overlay/temporary mount options and bounds, seed source and preserved metadata,
  package-state source constraints and rejection of unsafe seed/link layouts; compare two real root
  generations in HLT. Verify the authored journald policy limits; actual daemon/boot behavior remains
  part of physical role qualification.
