text: The installed early-boot entry shall invoke the role-specific storage helper before normal
  userspace startup and shall not continue normal startup when it fails or remains incomplete. Runtime
  block/mount helpers shall use only fixed bounded operations and return generic failure diagnostics
  without saved identity or secret contents. Boot preparation shall not interpret arbitrary commands
  from kernel arguments or saved data.
verification: Execute the startup entry with controlled success/failure helper outcomes; assert success
  can return while failure remains fenced and no normal-start sentinel runs. Accept the installed
  canonical root path before policy validation while refusing unsafe paths. Exercise command allowlists,
  bounded probe output/timeouts and generic CLI diagnostics with adversarial argument/data fixtures.
  Audit actual generated initramfs payloads separately as build tooling.
