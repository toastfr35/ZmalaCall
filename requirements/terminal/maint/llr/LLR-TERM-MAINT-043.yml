text: On retry, the initializer shall revalidate and preserve any committed identity even when the
  initialized-data marker was not committed. Only known bounded partial staging before identity commit
  may be retried; unexpected, linked, special, hard-linked or incompatible state shall be retained
  and rejected. A valid initialized record shall not cause identity regeneration or modify saved
  application data. Missing or corrupt committed identity shall not trigger a factory reset.
verification: Inject failures and process exits at every identity/marker synchronization boundary,
  resume and compare committed identity bytes. Exercise partial/complete staging, missing marker,
  corrupt committed identity and malicious staging. Assert no entropy call for an existing identity,
  no replacement of invalid saved records and retained application bytes.
