text: The terminal shall defer automatic activation until safe inactivity with no
  call, setup, settings write, in-flight configuration/console work, pending TV restoration,
  USB power transition or held input. It shall fence new call/input actions
  before acknowledging maintenance, and preserve sleeping USB media during updater-controlled
  restarts until genuine user or call activity.
verification: Exercise app lease/status integration with file IPC and call/input owners;
  assert busy states cannot grant a lease and acknowledged maintenance blocks calls
  before any USB/TV wake. Physical peripheral sleep is qualified separately.
