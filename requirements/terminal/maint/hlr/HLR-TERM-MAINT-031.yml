text: The terminal shall checkpoint persistent enrollment and settings before a trial
  and restore their confirmed contents before restarting the old application after
  a rejected or interrupted trial. Restoration shall be replayable without a missing
  live-data directory.
verification: Kill the restore process at atomic exchange and subsequent durable journal
  boundaries, then replay recovery twice and inspect confirmed settings and slot.
  Physical power interruption remains a separate qualification.
