text: The experimental image-managed terminal boot control shall retain an explicit confirmed system
  while admitting at most one durably consumed trial attempt. Linux control shall use validated redundant
  boot state, refuse corrupt or mismatched state without factory guesses, and separate candidate
  eligibility and activation from explicit transaction-bound confirmation. This helper boundary does
  not qualify full image installation, product health, watchdog handover or physical power-loss recovery.
verification: Execute the authored selector and Linux state transitions against actual environment
  tools on newly created isolated GPT fixtures. Verify trial consumption, fallback, confirmation,
  corrupt-copy refusal, stale-state rejection and unchanged bytes outside the declared raw environment
  ranges. Record real U-Boot/Pi boot and physical power cuts separately.
