text: The experimental image-managed terminal, including the combined role, shall
  admit its compact factory layout on supported SD media of sufficient capacity,
  relocating GPT backup metadata to the actual medium end before initializing
  device identity. Adaptation shall preserve partition extents and identities,
  filesystems and redundant boot state. It shall fence unknown or initialized
  media requiring repair. Extra capacity may remain unallocated.
verification: On newly created sparse regular-file GPT fixtures representing
  16 GB and 32 GB media, exercise relocation, retry after interrupted metadata
  writes, repeat boot, capacity refusal and byte preservation. Record actual Pi
  boot and physical power interruption separately; fixture results are not
  hardware qualification.
