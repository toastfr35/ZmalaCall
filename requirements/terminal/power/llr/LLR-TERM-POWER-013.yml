text: |
  USB power removal shall require five continuous minutes without terminal activity
  and a fresh remote battery level of at least 25 percent. Calls, ringing, setup,
  Settings, held buttons, stale application state and low or unknown battery shall
  retain or restore power. The idle interval shall start when ongoing activity ends.
verification: |
  Exercise the five-minute and battery boundaries and each inhibitor with a controlled
  clock. Check that stale and unknown data cannot permit power-off.
