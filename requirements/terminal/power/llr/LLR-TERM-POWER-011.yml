text: |
  Argon fan control shall run outside the UI thread through I2C bus 1 at address 0x1a.
  During connected calls it shall request 55 percent duty, or 100 percent at 65
  degrees Celsius. Outside calls and at shutdown it shall request stop. It shall not
  write power-mode registers.
verification: |
  Vary call state and temperature across the threshold. Check I2C requests, worker
  ownership and shutdown stop.
