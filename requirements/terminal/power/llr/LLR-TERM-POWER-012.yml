text: |
  Shared USB power control shall be off by default and require explicit enablement.
  Supported external camera and charger ports shall form one power domain. Power
  removal shall not be used with USB storage.
verification: |
  Start with default and enabled profiles. Check topology and rejection of storage.
  Equipment on unpowered ports cannot be discovered until power returns.
