text: |
  The Pi shall use only the Nuroum C10/C20 camera, microphone and speaker, rediscovered
  by identity after USB enumeration changes. It shall bind both future calls and
  an incoming call waiting during wake to the C10/C20 input and output before answering.
  Missing devices or rejected routes shall keep media unready, with diagnostics;
  HDMI, unrelated hardware and stale server identifiers shall never be substitutes.
  The host shall disable automatic USB runtime suspend for the C10/C20 USB device
  on enumeration and binding, independently of its port or node number. This
  shall not disable explicit guarded USB hub power switching or affect unrelated
  USB devices.
verification: |
  Renumber C10/C20 nodes and supply stale configured names. Start a pending call with
  HDMI routes, then restore C10/C20 discovery and verify both call routes and defaults.
  Inject missing capabilities, setter failure and wrong readback; check retryable
  failure and release of native references.
  Validate the C10/C20-only host rule against device/interface and unrelated identity
  fixtures and the udev parser. Check runtime power policy after real re-enumeration.
