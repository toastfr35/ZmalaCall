text: |
  The Pi shall use only the Nuroum C20 camera, microphone and speaker, rediscovered
  by identity after USB enumeration changes. It shall bind both future calls and
  an incoming call waiting during wake to the C20 input and output before answering.
  Missing devices or rejected routes shall keep media unready, with diagnostics;
  HDMI, unrelated hardware and stale server identifiers shall never be substitutes.
verification: |
  Renumber C20 nodes and supply stale configured names. Start a pending call with
  HDMI routes, then restore C20 discovery and verify both call routes and defaults.
  Inject missing capabilities, setter failure and wrong readback; check retryable
  failure and release of native references.
