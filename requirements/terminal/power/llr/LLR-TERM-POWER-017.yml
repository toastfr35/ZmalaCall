text: |
  With shared USB control enabled, a webcam symbol shall appear left of the battery
  icon. Its spacing shall match the gap right of Bluetooth. Confirmed on shall use
  mint. Confirmed off shall use a grey slash.

  Unknown or changing power shall use a grey question mark. Hub port status shall
  determine confirmation independently of camera enumeration. Settings shall hide the
  strip. Disabled USB control shall omit this icon.
verification: |
  Provide each hub status independently of camera and SDK state. Inspect icon color,
  mark, spacing and visibility.
