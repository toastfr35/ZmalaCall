text: |
  When observed TV state hides the UI, the first mapped remote press shall request
  wake or input selection and consume that press. Presses during input settling shall
  also be consumed. A consumed middle hold shall require release and a fresh press
  before volume motion works.
verification: |
  Hide the UI and send every button, including held middle and motion. Check selection
  requests and absence of normal button actions.
