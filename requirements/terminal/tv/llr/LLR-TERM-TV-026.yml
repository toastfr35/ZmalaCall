text: |
  When observed TV state hides the UI, the first mapped remote press shall request
  wake or input selection and consume that press. Presses during input settling shall
  also be consumed. A consumed middle press shall require release and a fresh press
  before the volume page opens.
  Unknown TV power state shall permit qualified power-on even when input switching
  was skipped or failed. It shall not permit power-on when power control is disabled,
  or be treated as a known standby state for restoration.
verification: |
  Hide the UI and send every button, including middle clicks and motion. Check selection
  requests and absence of normal button actions.
  Repeat after restart with unknown power, an unconfigured CEC adapter and only
  power control qualified; check wake and no invented standby restoration.
