text: |
  Calls, held buttons, setup and pending settings saves shall prevent idle
  restoration. Timeout expiry shall start only the current restoration operation.
  Idle restoration shall additionally require a TV-originated confirmation of the
  terminal's selected input received within 30 seconds and a live observer heartbeat
  younger than five seconds. Local commands, source-device announcements and observer
  heartbeats shall not renew that input evidence. Unknown, stale or other selected
  input shall inhibit the countdown; unknown observations may retain the saved
  baseline without authorizing restoration. Each standby attempt and authenticated
  power-off fallback shall recheck the selected-input evidence and cancellation.
  An originally-off TV shall return directly to standby without selecting a
  different source before the guarded standby operation.
verification: |
  Expire timeouts in each inhibited state and after a session replacement. Check that
  stale or inhibited work does not start.
  Inject own/source-device announcements, TV routing reports, stale/future/missing
  observation times, observer loss and manual input changes during asynchronous
  waits and authentication. Assert no unauthorized source/power commands.
