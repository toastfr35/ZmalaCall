text: |
  TV model integrations shall reside in separate bundled plugin directories and
  expose one TVDriver class with get_model, get_capabilities, get_power_status,
  set_power_on, set_power_off, get_current_input and set_current_input methods.
  Capabilities shall identify supported optional methods independently of setup
  qualification; unsupported methods shall raise NotImplementedError. Power and
  source getters shall return None when unknown and shall not infer success from
  sent commands. Input identifiers shall be reusable for selection. Setters shall
  report command acceptance without claiming observed completion, and power setters
  shall not blindly toggle. Operations shall use bounded I/O outside the UI thread.
  For Samsung, ambiguous or absent CEC power reports may be resolved by fresh local
  metadata reporting on or standby. Unavailable, malformed, oversized or unrecognized
  metadata shall remain unknown; settled CEC observations take precedence.
  Samsung wake shall query current power and leave an already-on TV unchanged,
  checking cancellation again after the observation. A paired network wake toggle
  shall require confirmed standby before authentication and again before sending.
  If unavailable, bounded CEC wake may be used after rechecking that the TV has
  not already turned on and the operation remains current. Power/input observations
  shall not be represented as proof that a source picture is playing.
  Normal call wake shall invoke the qualified model driver's wake operation before
  falling back to CEC. After driver I/O the controller shall recheck cancellation
  before sending fallback commands. Ambiguous CEC standby-restoration observations
  may be delegated to the guarded driver without authorizing a blind power toggle.
  The controller shall retain cancellation, qualification and restoration policy.
verification: |
  Load registered and unknown drivers; exercise supported and unsupported methods,
  unknown/transition observations, source round trips, failed and cancelled commands
  and timeout configuration. Assert no optimistic getter updates, no blind toggles
  and no propagation of optional driver failures into calls. Exercise ambiguous CEC
  with fresh metadata, network failure and oversized payloads. Verify already-on
  wake sends no command and cancellation during the power query prevents wake.
  Verify guarded network wake, changed/unknown state during authentication, and
  CEC fallback without a blind network toggle.
  Exercise normal call wake with successful, unavailable and cancelled drivers;
  assert no redundant CEC wake after success or cancellation and no unqualified
  source selection. Verify guarded restoration receives ambiguous CEC results.
