scope: Core
text: |
  Browsing and incoming calls shall each save their observed previous TV state. Their
  end shall restore that state through the configured inactivity countdown. An
  answered, declined, cancelled, failed or missed incoming call shall leave the
  terminal view available until expiry, returning to standby if originally off or
  to the observed previous input if originally on. Consecutive calls shall retain
  the original baseline. An older asynchronous restoration or handoff shall not
  override a newer TV session. Manual TV power/input changes shall release the
  pending return without undoing the user's choice.
verification: |
  Enter from standby or another input and end each call type. Assert no immediate
  restore command, a fresh idle lease, and restoration only on expiry. Interrupt
  the lease with another call or manual TV change. Complete an old handoff or
  restore after a newer session starts.
