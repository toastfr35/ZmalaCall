text: |
  Browsing and incoming calls shall each save their observed previous TV state. Their
  end shall restore that state, including decline, cancellation and hangup. An older
  asynchronous restoration shall not override a newer TV session.
verification: |
  Enter from standby or another input, then end each session type. Complete an old
  restore after a newer session starts.
