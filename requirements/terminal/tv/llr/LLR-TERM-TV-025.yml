text: |
  CEC selection shall prefer a connected connector with EDID and honor an explicitly
  fixed adapter. It shall retain that adapter through standby. A saved restoration
  shall keep its adapter during a call. Passive routing observation shall not announce
  the terminal as active source.
verification: |
  Vary connector state, fixed selection and standby. Inspect adapter stability and
  messages sent by passive observation.
