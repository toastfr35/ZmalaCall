text: |
  When any required C20 device or audio route is unavailable, the Pi shall keep
  the call waiting and retry discovery approximately once per second without
  blocking SIP or user input. It shall not start a partial receive-only call.
  Recovery shall allow the waiting call to proceed; cancellation, replacement or
  shutdown shall prevent a queued retry from starting or answering a stale call.
verification: |
  Fail discovery before native call allocation, then restore it. Check one-second
  answer and dial retries, successful recovery, and cancellation, generation, call
  identity and shutdown guards.
