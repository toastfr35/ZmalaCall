text: |
  A local speaker adjustment shall survive media-engine recreation during the
  application session. A changed configured default or application restart shall apply
  the configured level. USB wake shall reapply the desired level after hardware reset.
verification: |
  Recreate media, change the saved default and simulate USB wake. Check preserved or
  replaced level according to the event. Change the configured default while a volume
  click is pending, including a default equal to the last written level; verify the
  pending click cannot overwrite it and later deliberate adjustments still work.
