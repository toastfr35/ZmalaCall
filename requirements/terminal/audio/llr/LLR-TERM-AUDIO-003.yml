text: |
  The terminal shall support normal and speech processing profiles. Speech processing
  shall cap capture processing at 16 kHz while retaining the 48 kHz Opus clock and
  playback. Speech echo cancellation shall use a 500 ms window. Missing optional
  processing shall leave calling available and report the applied profile.
