text: |
  The terminal shall support normal and speech processing profiles. Speech processing
  shall cap capture processing at 16 kHz while retaining the 48 kHz Opus clock and
  playback. Speech echo cancellation shall use a 500 ms window. Missing optional
  processing shall leave calling available and report the applied profile.
  For both profiles, the Pi's C20 PCM path shall convert application audio to
  16 kHz stereo capture and 48 kHz stereo playback, without routing capture
  through a generic 48 kHz hardware-sharing buffer. This policy shall apply
  before native device enumeration and survive C20 device renumbering.
verification: |
  Inject plugin availability and registration failures. Inspect echo-rate parameters
  and the reported profile without assuming acoustic quality.
  Expand the real ALSA configuration without opening hardware and inspect each
  hardware direction's format, channels, rate and supplied card identity. Check
  that policy selection precedes SDK loading and missing policy fails explicitly.
  On the physical Pi with the terminal service stopped, repeatedly start and stop
  native-rate C20 capture and silent playback, then add MJPEG capture after
  the C20 microphone has remained RUNNING for 750 ms.
  Check successful completion, microphone byte count and complete camera data;
  record the requested/completed cycle count separately from portable evidence.
