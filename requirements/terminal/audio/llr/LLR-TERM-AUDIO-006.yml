text: |
  The middle-button call-volume control shall appear as a compact horizontal overlay above the current page, including the contact carousel and an established call. A surrounding black frame shall keep direction icons, track and current percentage readable while leaving most of the underlying page or video visible. It shall not replace the whole screen or change its selection/call. It shall remain open until closed by middle or preempted by a call/state, setup or focus change. A playback-control failure shall show a failure indication.
verification: |
  Open over the carousel and a call at multiple sizes; inspect the black frame, horizontal geometry, percentage and bounded coverage. Check that most of the underlying screen remains visible, it stays open without a timeout and failure feedback appears.
