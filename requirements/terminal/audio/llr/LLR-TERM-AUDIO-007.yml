text: |
  Volume-overlay requests shall occur at most ten times per second, with the final pending level flushed on close. One worker shall combine pending requests and establish the fixed model-specific hardware playback gain (+12 dB for C10, 0 dB for C20). The core owner shall apply the desired call-only software gain without changing microphone gain, hardware mute, ringtone/button levels or TV volume.
