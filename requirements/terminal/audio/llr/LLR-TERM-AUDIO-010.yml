text: |
  Call playback, incoming ringtone/preview/outgoing ringback and remote-button feedback shall have
  independent 0–100 percent levels. Zero shall silence only that sound category.
  Call playback shall map 5 percent to -16.8 dB (the former 40-percent gain),
  and 100 percent to 0 dB, interpolating linearly in dB between these endpoints.
  Legacy positive integer levels below 5 percent shall use -16.8 dB.
  Ringtone, ringback and button gains shall retain their existing -28 to 0 dB curve.
  Missing ringtone settings shall preserve the previous configured speaker level;
  new profiles shall default to call/ringtone 50 percent and button feedback 20 percent.
  C10/C20 hardware playback gain shall be fixed at +12 dB for both C10 and C20; call gain shall be applied on the
  native core owner thread, while ringtone/button PCM shall be attenuated separately
  for C10/C20 playback without changing capture or TV audio.
  During idle navigation and Settings, a distinct physical button press shall request
  one short cue: the same low tap for left/right and middle, a rising cue for green
  and a low double tap for red. Calls, incoming ringing and ringtone previews shall suppress feedback.
  Duplicate held
  reports, releases and internal timer actions shall not request extra clicks.
  A single feedback PCM stream shall remain warm only while idle navigation or
  Settings is eligible. It shall feed paced 2.5-millisecond stereo 48 kHz frames
  from one worker, with a 4 KiB nonblocking pipe and a 200 ms write deadline.
  All three cue shapes at every nonzero integer volume shall be prepared in
  at most 4 MiB of process memory before warming playback. Prepared frames shall
  survive call/preview pauses and volume changes, with no disk reads, synthesis
  or scaling on the warmed request path. Cancellation during preparation shall
  prevent the worker opening the audio device afterward.
  Requests during the initial 150 ms warmup or while a cue is playing shall be
  discarded; a request older than 200 ms shall not replay. To prioritize feedback
  before visual animation, input shall yield for at most
  20 ms for the first PCM frame, followed by a 20 ms head start only when that
  frame was submitted. Missing feedback shall not hold navigation beyond that bound.
  Audio helpers shall
  exclude the SDK TURN preloader while retaining the C10/C20 ALSA policy. Stopping
  before a call, ringing or ringtone preview shall terminate and reap the player
  with bounded 200 ms termination escalation, including a starting worker. Missing or
  waking audio shall not delay navigation or calls. Closing shall discard pending
  feedback and terminate its player. Scaled ringtone files shall use disposable
  private storage and be removed on replacement or shutdown. Outgoing ringback shall
  use the saved ringtone level at call initiation, with silent PCM at zero. Scaling
  shall preserve the SDK tone and use bounded actual PCM reads for its streaming
  WAV header. Active calls shall not replace tone files or change conversation gain.
  Feedback shall remain stopped until a native engine exists and shall release
  C10/C20 playback before native-core creation or replacement probes audio devices.
verification: |
  Assert category-isolated gains, zero/full PCM, bounded workers, duplicate handling,
  all-level RAM bank bounds/reuse, startup cancellation, stale/zero requests,
  call/preview suppression, player timeout and cleanup. On term2,
  check idle clicks, independent ringtone/call levels, silent call controls and C10/C20-only routing.
