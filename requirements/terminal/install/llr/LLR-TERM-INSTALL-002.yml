text: |
  Preflight shall require Pi 4 Model B, Raspberry Pi OS Lite 64-bit Debian Trixie, wired
  SSH/sudo, expected hostname zmala and sufficient space including 3 GiB on /var and 128
  MiB on the boot mount. OS checks shall verify architecture, Pi-image provenance and
  Trixie identifiers; they shall not claim to distinguish Lite from an image with extra
  desktop packages installed.
