text: |
  The terminal shall translate its core prompts, availability, questions, Yes/No, callback
  acknowledgment, video feedback and settings using the 95 included language catalogs.
  Display names shall remain unchanged. Rendering shall support Unicode shaping and
  right-to-left text. Language updates shall apply during calls; media-device changes
  shall wait until idle.

  USB connection, remote pairing/button verification and Wi-Fi/server QR setup shall use
  English until server enrollment supplies the selected language. Post-enrollment screens
  shall use that language where translations exist and fall back to English for missing
  diagnostic/help text. Detailed TV-check instructions currently provide English and
  French; catalog coverage shall not be presented as complete translation of every
  diagnostic screen.
