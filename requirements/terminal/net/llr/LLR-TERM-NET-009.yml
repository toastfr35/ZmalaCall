text: |
  Developer access shall accept live settings only for the enrolled device over
  HTTPS, connect back only to the enrolled server, verify its supplied SSH host
  key, and keep the tunnel password out of command arguments, logs and ordinary
  configuration caches. The terminal shall forward the server-loopback endpoint
  to a dedicated terminal-loopback SSH listener and reconnect while manually
  enabled. Deactivation shall stop the tunnel and shell listener and remove
  runtime secrets. Developer-control failures shall not prevent normal calls.
verification: |
  Exercise authorization, credential scope, process lifecycle and failure paths;
  verify the configured SSH and firewall boundaries and secret cleanup.
