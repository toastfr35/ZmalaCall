text: |
  The terminal shall pass Wi-Fi credentials through NetworkManager D-Bus. It shall
  create an owned UUID profile. The profile shall enable automatic connection and
  disable Wi-Fi power saving. Cancelled joins shall remove only their owned profile.
  Credentials shall not appear in command arguments or logs.
verification: |
  Stub D-Bus activation and cancel during each phase. Inspect profile settings,
  cleanup UUID and error redaction.
