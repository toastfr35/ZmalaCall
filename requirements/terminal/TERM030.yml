text: |
  The installed Pi shall start the display and terminal automatically under systemd, with
  restart on application failure. The application shall run as an unprivileged user;
  scoped permissions and helpers shall provide hardware access. Display startup shall
  manage Xorg, the compositor and fullscreen terminal without relying on a desktop
  environment.

  HDMI desktop resolution shall be independent of call capture resolution. The default
  shall prefer an advertised 1280 by 720 mode near 60 Hz; the shell installer shall also
  accept 1080p or automatic selection. Plymouth shall display the Zmala logo/word-cloud
  artwork during supported boot stages, while preserving recovery access and backups of
  edited boot configuration. This shall not imply uninterrupted artwork through firmware
  and HDMI negotiation.

  The compositor shall synchronize presentation. Compatible Pi 4 drivers shall receive the
  tested msdri3 configuration for synchronized page flips. Carousel scheduling shall use
  absolute 60 Hz deadlines and skip missed deadlines instead of accumulating drift. The
  target shall not be described as a guaranteed rendering frame rate on every display or
  load.
