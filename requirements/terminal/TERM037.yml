text: |
  The terminal shall authenticate configuration and management requests with its
  enrollment token and validate received configuration before accepting it.
  Credential-bearing requests shall not follow redirects. Cached configuration shall
  permit restart when the server is unavailable, without accepting malformed or partial
  replacements as valid settings.

  The applied configuration revision shall be published only after native engine setup
  succeeds. Media-device/profile changes shall wait until idle. Failed engine setup shall
  release the failed engine and retry the latest desired configuration while idle with a
  five-second backoff. Worker generations shall prevent obsolete responses from restoring
  superseded state. Live language, framing and volume changes shall use their supported
  paths without unnecessarily rebuilding a call engine.

  Periodic management shall separate configuration revision changes from live
  presence/callback updates. Background C20 mixer work shall use one worker and coalesce
  superseded volume values. Failed mutations shall not be blindly replayed as if they were
  idempotent reads; local settings persistence and conflicts shall follow TERM026 and
  SERV012.
