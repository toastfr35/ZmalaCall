text: |
  Rendering caches shall use entry and pixel-byte limits: text 8 MiB, portraits 32 MiB,
  source pictures 24 MiB, icons 2 MiB and Pi flattened backgrounds 8 MiB. Oversize objects
  may render without retention; eviction shall not invalidate displayed images. These
  limits cover retained payload rather than transient decoder allocation or total process
  RSS; native source resources shall be released on eviction/replacement/shutdown.
verification: |
  Exercise both count and byte eviction and a single oversize object while the UI retains
  a visible image.
