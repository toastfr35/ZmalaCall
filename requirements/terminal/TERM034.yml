text: |
  The standard terminal installer shall enable Argon One fan control; manual installation
  shall offer the corresponding explicit option and reject an enabled competing vendor fan
  service. Fan access shall run off the UI thread and use only I2C bus 1, address 0x1a and
  duty values from 0 to 100, without sending case power-mode commands.

  The fan shall be off outside connected calls, run at 55 percent during a connected call
  and rise to 100 percent at 65 degrees Celsius during that call. Hangup and service stop
  shall request fan-off. This policy shall not be described as an outside-call thermal
  override; firmware throttling remains separate.
