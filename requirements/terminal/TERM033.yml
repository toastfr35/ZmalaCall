text: |
  Automatic framing shall be disabled by default, configurable per terminal and supported
  for the Pi C20 path. Enabled detection shall sample uncropped camera images about once
  every two seconds, include detected people as a group with margin and limit digital zoom
  to 2 times. Stable observations shall be required before tightening the crop, while
  newly detected people outside it shall widen the view. Pan/zoom shall ease over about
  two seconds.

  Temporary misses shall retain people for up to six seconds; sustained absence or failed
  detection shall return to the wide view, with an eight-second native watchdog. New calls
  shall start wide. Session/sample tokens shall reject stale results after toggles,
  dimension changes and call transitions.

  Detection shall run locally in a lower-priority process with two inference threads and
  one replaceable thumbnail slot, without blocking the UI or media pipeline. The installer
  shall prepare a checksum-pinned model/runtime before calls; calls shall not download
  models or upload inference images. The video worker shall apply the crop once for
  preview and encoding and avoid a crop copy when framing is wide or disabled.
