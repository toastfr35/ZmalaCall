text: |
  The terminal shall run independently of the server on Windows and the supported Linux/Pi
  configuration with Tk and Liblinphone. Windows shall provide start and stop launchers,
  an optional fullscreen mode and an explicit unconfigured profile option on the start
  launcher. Starting a terminal shall not implicitly start the server.

  Shared source and assets shall live under common/, Windows adapters under windows/, and
  Linux adapters and native media under linux/. Linux installation archives shall omit
  Windows code. Source-layout upgrades shall preserve existing private data paths. Pi
  automatic startup and installation are specified separately in TERM029 and TERM030.
