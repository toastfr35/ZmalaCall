text: |
  Each distinct left or right press shall move one contact cyclically, including
  rapid presses during animation. Held-button repeats shall not add moves.
  Animation shall continue from its current position towards the latest selection;
  confirmation during animation shall use that selection. Directory refresh shall
  retain the selected contact when it remains in the list. Removing that contact shall
  select a valid remaining contact.
verification: |
  Move across both list ends, rapidly press each direction three times, reverse
  direction during animation and confirm before it finishes. Check every press
  counts, held repeats do not, motion is continuous and the confirmed identity
  matches the final selection. Update or remove the selected contact and check
  the resulting identity.
