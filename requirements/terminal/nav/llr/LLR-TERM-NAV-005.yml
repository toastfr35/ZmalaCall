text: |
  Cards shall show Available in green with a check for confirmed live availability,
  Try calling in blue with a question mark for unconfirmed push eligibility, and
  Offline in red with a cross otherwise. Both available and push contacts shall
  permit call confirmation. After six seconds
  without successful refresh, contacts shall be treated as unavailable.
