text: |
  Green on an available contact shall open its picture and name for confirmation. A
  second distinct green press shall recheck permission and availability before
  dialing. Any other key shall cancel and retain contact selection. A held green
  button shall not confirm twice.
verification: |
  Confirm, cancel, repeat a held key and change permissions between presses. Check
  that only a fresh valid confirmation dials.
