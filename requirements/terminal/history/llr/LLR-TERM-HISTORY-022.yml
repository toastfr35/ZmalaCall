text: |
  A pending callback shall show a return-arrow tag on its contact without an extra
  footer. A pending request received from a current contact shall show a persistent
  high-contrast yellow banner with a flag and a localized request to call back over
  that contact picture, on selected and adjacent cards. Completed, cancelled and
  unrelated requests shall not show this banner. Incoming wording shall request
  action (English Please call back, French À rappeler), distinct from outgoing
  confirmation that a request was sent. It shall not obscure the name or
  availability band or start a call. Red shall open cancellation confirmation. Green shall open cancellation for
  an unavailable contact and call confirmation for an available contact.
verification: |
  Render tagged contacts in both availability states. Send green and red and check the
  selected confirmation action. Render incoming requests, both directions and
  cancelled/completed/unrelated requests; check banner visibility, bounded geometry
  and no automatic dialing.
