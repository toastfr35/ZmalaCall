text: |
  Opening a contact confirmation or first connecting its incoming call shall
  acknowledge existing counts for that contact. Navigation, ringing, failed answer and
  decline shall not acknowledge them. Repeated connected events shall preserve
  notifications received after connection.
verification: |
  Exercise acknowledgement and non-acknowledgement actions. Add a notification after
  connection and deliver another connected event.
