text: |
  An available requested contact shall trigger one ten-second notice per request when
  both sides can call. The idle terminal shall wait for five seconds without input
  before selecting that contact. The notice shall neither dial nor interrupt ringing,
  a call or confirmation.
verification: |
  Change availability and input time across each page state. Check selection delay,
  notice duration, duplicate suppression and no dial.
