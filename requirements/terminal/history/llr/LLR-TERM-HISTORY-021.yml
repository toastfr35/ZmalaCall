text: |
  An outgoing terminal attempt ending before connection, including rejection,
  timeout, preflight failure or caller cancellation, shall offer a callback request
  for the same currently permitted contact after media ends. Answered calls and
  declined incoming calls shall not trigger this offer. A late call-end event shall
  not dismiss or duplicate the prompt. An existing pending outgoing request shall
  not be requested again. The offer shall not label a voluntarily cancelled contact
  unavailable. Green confirmation shall submit the callback request. Other
  buttons shall cancel before submission. Pending submission shall hide the answer
  prompts. Success shall appear only after server acknowledgement. Failure shall show
  feedback without automatic mutation retry.
verification: |
  Use each button and delay, reject or accept the server response. Count submissions
  and inspect prompts and outcome feedback. End unanswered outgoing calls by
  rejection, timeout and cancellation, including immediate and delayed native end
  events. Connect calls and decline incoming calls as controls. Verify one prompt
  for the original permitted contact, no duplicate submission or late redial, both
  confirmation answers and truthful wording.
