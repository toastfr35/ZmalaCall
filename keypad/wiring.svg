<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1120" viewBox="0 0 1480 1120" role="img" aria-labelledby="title desc">
<title id="title">ZmalaCall Nano keypad wiring</title>
<desc id="desc">Four normally-open switches on D2 to D5, and four LEDs controlled by 1 kilohm resistors directly from GPIO on D6 to D9. USB supplies serial data and power. All grounds connect to Nano GND.</desc>
<rect width="1480" height="1120" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="50" y="62" font-size="34" fill="#182431" text-anchor="start" font-weight="700">ZmalaCall · USB serial keypad</text>
<text x="50" y="100" font-size="22" fill="#182431" text-anchor="start" font-weight="400">Classic 5 V Arduino Nano / ATmega328P · four arcade switches + four LEDs</text>
<text x="50" y="135" font-size="18" fill="#435060" text-anchor="start" font-weight="400">Logical net labels: connect D2–D9 to the matching Nano pins. All GND symbols are the same connection.</text>
<rect x="100" y="172" width="340" height="85" rx="8" fill="#f1f5fa" stroke="#b9c6d2" stroke-width="2"/>
<text x="270" y="204" font-size="20" fill="#182431" text-anchor="middle" font-weight="700">Raspberry Pi / Windows PC</text>
<text x="270" y="233" font-size="18" fill="#182431" text-anchor="middle" font-weight="400">USB data cable · power + serial</text>
