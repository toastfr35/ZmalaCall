<text x="50" y="996" font-size="17" fill="#435060" text-anchor="start" font-weight="700">COMMON GND · Nano GND, switch COM terminals, LED cathodes and output pull-downs</text>
<text x="50" y="1040" font-size="18" fill="#182431" text-anchor="start" font-weight="400">Four 1 kΩ series resistors limit LED current; four 10 kΩ pull-downs keep outputs low during reset.</text>
<text x="50" y="1072" font-size="18" fill="#182431" text-anchor="start" font-weight="400">High-efficiency, non-flashing LEDs · about 1.5–3.5 mA per LED. Check brightness through the button caps.</text>
<text x="50" y="1104" font-size="18" fill="#182431" text-anchor="start" font-weight="700">Do not connect LED anodes to the Nano 5V pin in this circuit. Keep LED and switch terminals separate.</text>
</g></svg>
