# Raspberry Pi OS Xorg's msdri3 path keeps DRI3 video acceleration and lets
# Picom flip its XRender buffers. Glamor's buffers failed KMS import on Pi 4,
# making Present fall back to copies and leaving visible horizontal tears.
Section "Device"
    Identifier "Zmala Raspberry Pi 4"
    Driver "modesetting"
    Option "AccelMethod" "msdri3"
EndSection
