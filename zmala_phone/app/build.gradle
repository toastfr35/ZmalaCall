plugins { id 'com.android.application' }
// Private signing material is supplied by the release operator, never by Git.
def releaseSigningPath = System.getenv('ZMALA_RELEASE_SIGNING')
def releaseSigning = releaseSigningPath ? new groovy.json.JsonSlurper().parse(file(releaseSigningPath)) : null
android {
 namespace 'org.zmala.phone'
 compileSdk 37
 ndkVersion '29.0.14206865'
 buildFeatures { resValues true }
 signingConfigs {
  release {
   if (releaseSigning) {
    storeFile file(releaseSigning.storeFile)
    storePassword releaseSigning.storePassword
    keyAlias releaseSigning.keyAlias
    keyPassword releaseSigning.keyPassword
   }
  }
 }
 buildTypes {
  release {
   debuggable false
   signingConfig signingConfigs.release
   // Keep the qualified native/JNI integration unchanged for the first release.
   minifyEnabled false
  }
 }
 defaultConfig {
  applicationId 'org.zmala.phone'; minSdk 28; targetSdk 37
  versionCode 46; versionName '0.3.37'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  ndk { abiFilters 'arm64-v8a', 'x86_64' }
  // Local Firebase client configuration is optional for fixture-only/CI builds.
  def firebaseFile = file('google-services.json')
  if (firebaseFile.exists()) {
    def firebase = new groovy.json.JsonSlurper().parse(firebaseFile)
    def client = firebase.client.find { it.client_info.android_client_info.package_name == applicationId }
    resValue 'string', 'google_app_id', client.client_info.mobilesdk_app_id
    resValue 'string', 'google_api_key', client.api_key[0].current_key
    resValue 'string', 'gcm_defaultSenderId', firebase.project_info.project_number
    resValue 'string', 'project_id', firebase.project_info.project_id
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
 sourceSets {
  main.jniLibs.srcDirs += [layout.buildDirectory.dir('turn/jniLibs').get().asFile]
  androidTest.jniLibs.srcDirs += [layout.buildDirectory.dir('turn/testJniLibs').get().asFile]
  test.java.srcDirs = [rootProject.file('../tests/android/LLT/unit')]
  androidTest.java.srcDirs = [rootProject.file('../tests/android/HLT'), rootProject.file('../tests/android/LLT/device'), rootProject.file('../tests/support/android')]
 }
 testOptions { unitTests.returnDefaultValues = true }
}
configurations { turnSdk }
dependencies { turnSdk('org.linphone:linphone-sdk-android:5.5.32') { transitive = false } }
tasks.register('buildTurn', Exec) {
 def script = rootProject.file('../build_tools/android/build-turn.py')
 inputs.file(script)
 inputs.file('src/main/cpp/turn-framing.cpp')
 inputs.file(rootProject.file('../zmala_terminal/common/native/turn-write.h'))
 inputs.file(rootProject.file('../tests/support/native/turn-write-cases.h'))
 inputs.file(rootProject.file('../tests/support/android/turn-parser.cpp'))
 inputs.files(configurations.turnSdk)
 outputs.dir(layout.buildDirectory.dir('turn/jniLibs'))
 outputs.dir(layout.buildDirectory.dir('turn/testJniLibs'))
 doFirst {
  def localPython = rootProject.file(System.getProperty('os.name').startsWith('Windows') ? '../.venv/Scripts/python.exe' : '../.venv/bin/python')
  commandLine(System.getenv('PYTHON') ?: (localPython.exists() ? localPython.absolutePath : 'python3'),
   script.absolutePath, '--aar', configurations.turnSdk.singleFile.absolutePath,
   '--ndk', androidComponents.sdkComponents.ndkDirectory.get().asFile.absolutePath, '--output', layout.buildDirectory.dir('turn').get().asFile.absolutePath)
 }
}
tasks.named('preBuild').configure { dependsOn('buildTurn') }
tasks.register('checkReleaseInputs') {
 doLast {
  if (!releaseSigning || !['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { releaseSigning[it] }) {
   throw new GradleException('Set ZMALA_RELEASE_SIGNING to the private signing JSON; debug signing is not a release fallback.')
  }
  if (!file(releaseSigning.storeFile).isFile()) throw new GradleException('Release keystore is missing.')
  if (!file('google-services.json').isFile()) throw new GradleException('Release requires Firebase client configuration for incoming calls.')
 }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn('checkReleaseInputs') }
dependencies {
 implementation platform('com.google.firebase:firebase-bom:35.0.2')
 implementation 'com.google.firebase:firebase-messaging'
 implementation 'org.linphone:linphone-sdk-android:5.5.32'
 implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
 // CaptureActivity uses ContextCompat/ActivityCompat; keep these in the shipped APK.
 implementation 'androidx.core:core:1.17.0'
 implementation 'androidx.work:work-runtime:2.12.0'
 implementation 'androidx.concurrent:concurrent-futures:1.3.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20250517'
 androidTestImplementation 'androidx.test.ext:junit:1.3.0'
 androidTestImplementation 'androidx.test:runner:1.7.0'
 androidTestImplementation 'androidx.test:rules:1.7.0'
 androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
