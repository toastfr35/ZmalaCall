# @llr LLR-TERM-AUDIO-003
# Keep the distribution configuration for every other card. The C20 has
# asymmetric USB rates; generic dsnoop otherwise opens its input at 48 kHz.
<confdir:alsa.conf>
cards.USB-Audio."Nuroum C20".pcm.default {
    @args [ CARD ]
    @args.CARD { type string }
    type asym
    playback.pcm {
        type plug
        slave {
            pcm { type hw card $CARD device 0 }
            format S16_LE
            channels 2
            rate 48000
        }
    }
    capture.pcm {
        type plug
        slave {
            pcm { type hw card $CARD device 0 }
            format S16_LE
            channels 2
            rate 16000
        }
    }
}
